<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LifeGraph</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0f; color: #e0e0e0; overflow: hidden; }
    #canvas { width: 100vw; height: 100vh; display: block; }

    /* Sidebar */
    #sidebar {
      position: fixed; top: 0; right: -420px; width: 420px; height: 100vh;
      background: #111119; border-left: 1px solid #1e1e2e;
      transition: right 0.3s ease; z-index: 10;
      overflow-y: auto; padding: 28px;
    }
    #sidebar.open { right: 0; }
    #sidebar h2 { font-size: 20px; margin-bottom: 4px; color: #fff; font-weight: 600; }
    #sidebar .meta { font-size: 13px; color: #666; margin-bottom: 20px; }
    #sidebar .section-title { font-size: 12px; color: #555; text-transform: uppercase; letter-spacing: 1px; margin: 20px 0 10px; }
    #sidebar .close-btn {
      position: absolute; top: 18px; right: 18px;
      background: none; border: none; color: #555; font-size: 22px; cursor: pointer;
    }
    #sidebar .close-btn:hover { color: #fff; }

    .topic-chip {
      display: inline-block; padding: 5px 12px; margin: 3px 4px 3px 0;
      border-radius: 14px; font-size: 12px; cursor: pointer;
      transition: all 0.15s; border: 1px solid #2a2a3a; background: #16162a;
      color: #aaa;
    }
    .topic-chip:hover { background: #252548; color: #fff; border-color: #4a4a6a; }
    .topic-chip .count { color: #555; margin-left: 4px; }

    .doc-list { list-style: none; }
    .doc-list li {
      padding: 12px 14px; margin-bottom: 6px;
      background: #16162a; border-radius: 10px; border: 1px solid #1e1e2e;
      cursor: pointer; transition: all 0.15s;
    }
    .doc-list li:hover { background: #1e1e3a; border-color: #3a3a5a; }
    .doc-list li .doc-title { font-size: 13px; color: #ddd; line-height: 1.4; }
    .doc-list li .doc-meta { font-size: 11px; color: #555; margin-top: 4px; }

    /* Header */
    #header { position: fixed; top: 20px; left: 24px; z-index: 5; }
    #header h1 {
      font-size: 24px; font-weight: 700; color: #fff;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #a78bfa, #6366f1);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    #header p { font-size: 11px; color: #444; margin-top: 2px; }

    /* Search */
    #search { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 5; }
    #search input {
      width: 360px; padding: 9px 16px; border-radius: 20px;
      border: 1px solid #1e1e2e; background: #111119; color: #ddd;
      font-size: 13px; outline: none;
    }
    #search input:focus { border-color: #6366f1; box-shadow: 0 0 0 2px rgba(99,102,241,0.15); }
    #search .results {
      position: absolute; top: 42px; left: 0; width: 360px;
      background: #111119; border: 1px solid #1e1e2e; border-radius: 12px;
      max-height: 260px; overflow-y: auto; display: none;
    }
    #search .results.visible { display: block; }
    #search .results .result-item {
      padding: 10px 16px; cursor: pointer; font-size: 13px;
      border-bottom: 1px solid #1a1a2a;
    }
    #search .results .result-item:hover { background: #1e1e3a; }
    #search .results .result-item:last-child { border: none; }
    #search .results .result-section {
      padding: 6px 16px 2px; font-size: 10px; color: #555;
      text-transform: uppercase; letter-spacing: 1px;
      border-bottom: 1px solid #1a1a2a;
    }
    #search .results .result-snippet {
      font-size: 11px; color: #555; margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #search .filter-chips {
      display: flex; gap: 4px; margin-top: 6px; justify-content: center;
    }
    #search .filter-chip {
      font-size: 10px; padding: 3px 10px; border-radius: 10px;
      border: 1px solid #1e1e2e; background: #111119; color: #666;
      cursor: pointer; transition: all 0.15s; font-family: inherit;
    }
    #search .filter-chip:hover { color: #ddd; border-color: #3a3a5a; }
    #search .filter-chip.active { color: #a78bfa; border-color: #6366f1; background: #12122a; }

    /* View toggle buttons */
    .view-toggles {
      position: fixed; top: 20px; right: 24px; z-index: 6;
      display: flex; gap: 8px;
    }
    .view-btn {
      background: #111119; border: 1px solid #1e1e2e; color: #888;
      padding: 8px 16px; border-radius: 20px; font-size: 12px;
      cursor: pointer; transition: all 0.15s; font-family: inherit;
    }
    .view-btn:hover { color: #fff; border-color: #6366f1; }
    .view-btn.active { color: #6366f1; border-color: #6366f1; background: #12122a; }

    /* Category filters */
    #catFilters {
      position: fixed; top: 56px; right: 24px; z-index: 6;
      display: flex; flex-wrap: wrap; gap: 6px; max-width: 420px;
      justify-content: flex-end;
    }
    .cat-filter {
      display: flex; align-items: center; gap: 5px;
      padding: 4px 10px; border-radius: 12px; font-size: 11px;
      cursor: pointer; transition: all 0.15s; font-family: inherit;
      border: 1px solid #1e1e2e; background: #111119; color: #999;
      user-select: none;
    }
    .cat-filter:hover { border-color: #3a3a5a; }
    .cat-filter.active { border-color: #6366f1; color: #fff; background: #12122a; }
    .cat-filter.dimmed { opacity: 0.3; }
    .cat-filter .cf-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

    /* Overview panel */
    #overview {
      position: fixed; top: 60px; right: 24px; z-index: 5;
      width: 320px; max-height: calc(100vh - 100px);
      background: #111119; border: 1px solid #1e1e2e; border-radius: 16px;
      overflow-y: auto; padding: 20px;
      display: none;
    }
    #overview.visible { display: block; }
    #overview h3 {
      font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px;
      color: #555; margin-bottom: 16px;
    }

    .overview-cat {
      margin-bottom: 18px; cursor: pointer;
      padding: 12px 14px; border-radius: 12px;
      border: 1px solid transparent;
      transition: all 0.15s;
    }
    .overview-cat:hover { background: #16162a; border-color: #1e1e2e; }
    .overview-cat .cat-header {
      display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
    }
    .overview-cat .cat-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .overview-cat .cat-name { font-size: 14px; font-weight: 600; color: #ddd; }
    .overview-cat .cat-count { font-size: 12px; color: #555; margin-left: auto; }
    .overview-cat .cat-topics { font-size: 12px; color: #666; line-height: 1.6; }
    .overview-cat .cat-topics span { color: #999; }

    /* Legend */
    #legend {
      position: fixed; bottom: 20px; left: 24px; z-index: 5;
      display: flex; flex-wrap: wrap; gap: 8px; max-width: 500px;
    }
    .legend-item {
      display: flex; align-items: center; gap: 5px;
      font-size: 11px; color: #555; cursor: pointer;
      padding: 3px 8px; border-radius: 10px;
      transition: all 0.15s;
    }
    .legend-item:hover { color: #aaa; background: rgba(255,255,255,0.03); }
    .legend-dot { width: 8px; height: 8px; border-radius: 50%; }

    /* Stats */
    #stats {
      position: fixed; bottom: 20px; right: 24px; z-index: 5;
      font-size: 11px; color: #333;
    }

    .tooltip {
      position: fixed; padding: 8px 14px; background: #16162a;
      border: 1px solid #2a2a3a; border-radius: 10px;
      font-size: 12px; pointer-events: none; z-index: 20;
      display: none; box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    .tooltip .tt-count { color: #6366f1; font-weight: 600; }

    /* Report view */
    #reportView {
      position: fixed; inset: 0; z-index: 4;
      background: #0a0a0f; overflow-y: auto;
      padding: 80px 40px 40px;
      display: none;
    }
    #reportView.visible { display: block; }
    #reportView .report-container { max-width: 800px; margin: 0 auto; }
    #reportView .report-header {
      margin-bottom: 32px;
    }
    #reportView .report-header h2 {
      font-size: 22px; font-weight: 700; color: #fff; margin-bottom: 8px;
    }
    #reportView .report-header .report-sub { font-size: 13px; color: #555; }
    #reportView .report-period {
      display: flex; gap: 12px; align-items: center; margin-bottom: 28px;
    }
    #reportView .report-period select,
    #reportView .report-period input {
      padding: 8px 14px; border-radius: 12px;
      border: 1px solid #1e1e2e; background: #111119; color: #ddd;
      font-size: 13px; outline: none; font-family: inherit;
    }
    #reportView .report-period select:focus,
    #reportView .report-period input:focus { border-color: #6366f1; }

    .report-category {
      margin-bottom: 28px;
    }
    .report-cat-header {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 14px; padding-bottom: 8px;
      border-bottom: 1px solid #1a1a2a;
      cursor: pointer; user-select: none;
    }
    .report-cat-header:hover { background: rgba(255,255,255,0.02); border-radius: 8px; }
    .report-cat-header .collapse-arrow {
      font-size: 10px; color: #555; transition: transform 0.2s; margin-left: 4px;
    }
    .report-cat-header .collapse-arrow.collapsed { transform: rotate(-90deg); }
    .collapsible-body { overflow: hidden; transition: max-height 0.3s ease; }
    .collapsible-body.collapsed { max-height: 0 !important; }
    .report-cat-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .report-cat-name { font-size: 16px; font-weight: 600; color: #ddd; }
    .report-cat-count { font-size: 12px; color: #555; margin-left: auto; }

    .report-cluster { margin-bottom: 16px; margin-left: 8px; }
    .report-cluster-name {
      font-size: 13px; font-weight: 600; color: #aaa; margin-bottom: 8px;
    }
    .report-doc {
      display: flex; align-items: baseline; gap: 10px;
      padding: 8px 12px; margin-bottom: 4px;
      border-radius: 8px; cursor: pointer; transition: background 0.15s;
    }
    .report-doc:hover { background: #16162a; }
    .report-doc .doc-title { font-size: 13px; color: #ccc; flex: 1; }
    .report-doc .doc-date { font-size: 11px; color: #555; white-space: nowrap; }
    .report-doc .doc-source {
      font-size: 10px; padding: 2px 8px; border-radius: 8px;
      background: #16162a; color: #666; white-space: nowrap;
    }

    .report-empty { font-size: 14px; color: #444; text-align: center; padding: 40px; }

    /* Projects view */
    #projectsView {
      position: fixed; inset: 0; z-index: 4;
      background: #0a0a0f; overflow-y: auto;
      padding: 80px 40px 40px; display: none;
    }
    #projectsView.visible { display: block; }
    .projects-container { max-width: 1100px; margin: 0 auto; }
    .projects-header { margin-bottom: 24px; }
    .projects-header h2 { font-size: 22px; font-weight: 700; color: #fff; margin-bottom: 4px; }
    .projects-header .projects-sub { font-size: 13px; color: #555; }
    .projects-controls {
      display: flex; gap: 10px; align-items: center; margin-bottom: 24px; flex-wrap: wrap;
    }
    .projects-controls select {
      padding: 7px 12px; border-radius: 12px;
      border: 1px solid #1e1e2e; background: #111119; color: #ddd;
      font-size: 12px; font-family: inherit; outline: none;
    }
    .project-cat-section { margin-bottom: 32px; }
    .project-cat-title {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 1px; margin-bottom: 14px; padding-bottom: 8px;
      border-bottom: 1px solid #1a1a2a;
      cursor: pointer; user-select: none;
    }
    .project-cat-title:hover { background: rgba(255,255,255,0.02); border-radius: 8px; }
    .project-cat-title .collapse-arrow {
      font-size: 10px; color: #555; transition: transform 0.2s; margin-left: 4px;
    }
    .project-cat-title .collapse-arrow.collapsed { transform: rotate(-90deg); }
    .project-cat-title .pct-dot { width: 10px; height: 10px; border-radius: 50%; }
    .project-cat-title .pct-count { font-weight: 400; color: #555; margin-left: auto; font-size: 11px; }
    .project-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px;
    }
    .project-card {
      background: #111119; border: 1px solid #1e1e2e; border-radius: 14px;
      padding: 18px 20px; cursor: pointer; transition: all 0.2s;
    }
    .project-card:hover { border-color: #3a3a5a; background: #14142a; transform: translateY(-1px); }
    .project-card .pc-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .project-card .pc-name { font-size: 15px; font-weight: 600; color: #ddd; flex: 1; line-height: 1.3; }
    .project-card .pc-status {
      font-size: 10px; padding: 3px 10px; border-radius: 10px;
      font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap;
    }
    .ps-active { background: #1e3a5f; color: #60a5fa; }
    .ps-shipped { background: #1a3a2a; color: #4ade80; }
    .ps-blocked { background: #3a2a1a; color: #fbbf24; }
    .ps-idea { background: #1e1e2e; color: #888; }
    .ps-abandoned { background: #2a1a1a; color: #888; }
    .pc-phase {
      font-size: 10px; padding: 3px 10px; border-radius: 10px; font-weight: 500;
      white-space: nowrap;
    }
    .pp-planning { background: #1e1e3a; color: #a78bfa; }
    .pp-building { background: #1a2a3a; color: #60a5fa; }
    .pp-shipped { background: #1a3a2a; color: #4ade80; }
    .project-card .pc-stats {
      display: flex; gap: 16px; font-size: 12px; color: #666; margin-bottom: 8px;
    }
    .project-card .pc-dates { font-size: 11px; color: #444; }
    .project-card .pc-docs-preview {
      margin-top: 10px; padding-top: 10px; border-top: 1px solid #1a1a2a;
    }
    .project-card .pc-doc-item {
      font-size: 11px; color: #666; padding: 2px 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* Password gate */
    #gate {
      position: fixed; inset: 0; z-index: 100;
      background: #0a0a0f; display: flex;
      align-items: center; justify-content: center;
      flex-direction: column; gap: 16px;
    }
    #gate h1 {
      font-size: 32px; font-weight: 700;
      background: linear-gradient(135deg, #a78bfa, #6366f1);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    #gate p { font-size: 13px; color: #444; }
    #gate input {
      width: 260px; padding: 10px 16px; border-radius: 12px;
      border: 1px solid #1e1e2e; background: #111119; color: #ddd;
      font-size: 14px; outline: none; text-align: center;
    }
    #gate input:focus { border-color: #6366f1; box-shadow: 0 0 0 2px rgba(99,102,241,0.15); }
    #gate .error { color: #f87171; font-size: 12px; min-height: 18px; }
    #gate.hidden { display: none; }
  </style>
</head>
<body>
  <div id="gate">
    <h1>LifeGraph</h1>
    <p>Enter password to view</p>
    <input type="password" id="gateInput" placeholder="Password" autofocus>
    <div class="error" id="gateError"></div>
  </div>

  <svg id="canvas"></svg>

  <div id="header">
    <h1>LifeGraph</h1>
    <p id="headerSub"></p>
  </div>

  <div id="search">
    <input type="text" placeholder="Search topics, docs, projects... (jira: github: status:)" id="searchInput">
    <div class="filter-chips">
      <button class="filter-chip active" data-source="all" onclick="setSearchFilter(this)">All</button>
      <button class="filter-chip" data-source="google_docs" onclick="setSearchFilter(this)">Google Docs</button>
      <button class="filter-chip" data-source="confluence" onclick="setSearchFilter(this)">Confluence</button>
      <button class="filter-chip" data-source="jira" onclick="setSearchFilter(this)">Jira</button>
      <button class="filter-chip" data-source="slack" onclick="setSearchFilter(this)">Slack</button>
      <button class="filter-chip" data-source="github" onclick="setSearchFilter(this)">GitHub</button>
    </div>
    <div class="results" id="searchResults"></div>
  </div>

  <div class="view-toggles">
    <button class="view-btn active" id="graphBtn" onclick="switchView('graph')">Graph</button>
    <button class="view-btn" id="timelineBtn" onclick="switchView('timeline')">Timeline</button>
    <button class="view-btn" id="reportBtn" onclick="switchView('report')">Report</button>
    <button class="view-btn" id="projectsBtn" onclick="switchView('projects')">Projects</button>
    <button class="view-btn" id="overview-toggle" onclick="toggleOverview()">Overview</button>
  </div>
  <div id="catFilters"></div>
  <div id="overview">
    <h3>Work areas</h3>
    <div id="overviewContent"></div>
  </div>

  <div id="reportView">
    <div class="report-container">
      <div class="report-header">
        <h2>What did I work on?</h2>
        <div class="report-sub" id="reportSub"></div>
      </div>
      <div class="report-period">
        <select id="reportRange" onchange="applyPreset()">
          <option value="7">Last 7 days</option>
          <option value="14">Last 14 days</option>
          <option value="30" selected>Last 30 days</option>
          <option value="60">Last 60 days</option>
          <option value="90">Last 90 days</option>
          <option value="180">Last 6 months</option>
          <option value="365">Last year</option>
        </select>
        <span style="color:#555; font-size:12px;">from</span>
        <input type="date" id="reportFrom" onchange="onDateInputChange()">
        <span style="color:#555; font-size:12px;">to</span>
        <input type="date" id="reportTo" onchange="onDateInputChange()">
        <div style="display:flex; gap:4px; margin-left:12px;">
          <button class="view-btn active" id="reportModeTopics" onclick="setReportMode('topics')">By Topic</button>
          <button class="view-btn" id="reportModeUpdate" onclick="setReportMode('update')">Summary</button>
        </div>
        <button id="copySummaryBtn" onclick="copySummary()" style="display:none; margin-left:8px; padding:7px 14px; border-radius:12px; border:1px solid #1e1e2e; background:#111119; color:#a78bfa; font-size:11px; cursor:pointer; font-family:inherit; transition:all 0.15s;">Copy as Markdown</button>
      </div>
      <div id="reportContent"></div>
    </div>
  </div>

  <div id="projectsView">
    <div class="projects-container">
      <div class="projects-header">
        <h2>Projects</h2>
        <div class="projects-sub" id="projectsSub"></div>
      </div>
      <div class="projects-controls">
        <select id="projectsSort" onchange="renderProjects()">
          <option value="activity">Sort by last activity</option>
          <option value="docs">Sort by doc count</option>
          <option value="name">Sort by name</option>
        </select>
        <select id="projectsStatus" onchange="renderProjects()">
          <option value="all">All statuses</option>
          <option value="active">Active</option>
          <option value="shipped">Shipped</option>
          <option value="blocked">Blocked</option>
          <option value="idea">Idea</option>
        </select>
        <select id="projectsPhase" onchange="renderProjects()">
          <option value="all">All phases</option>
          <option value="Planning">Planning</option>
          <option value="Building">Building</option>
          <option value="Shipped">Shipped</option>
        </select>
      </div>
      <div id="projectsContent"></div>
    </div>
  </div>

  <div id="timelineControls" style="display:none; position:fixed; top:60px; left:50%; transform:translateX(-50%); z-index:6; gap:10px; align-items:center;">
    <select id="timelineRange" onchange="applyTimelinePreset()" style="padding:7px 12px; border-radius:12px; border:1px solid #1e1e2e; background:#111119; color:#ddd; font-size:12px; font-family:inherit; outline:none;">
      <option value="30">Last 30 days</option>
      <option value="60">Last 60 days</option>
      <option value="90" selected>Last 90 days</option>
      <option value="180">Last 6 months</option>
      <option value="365">Last year</option>
      <option value="0">All time</option>
    </select>
    <span style="color:#555; font-size:11px;">from</span>
    <input type="date" id="tlFrom" onchange="onTlDateChange()" style="padding:7px 12px; border-radius:12px; border:1px solid #1e1e2e; background:#111119; color:#ddd; font-size:12px; font-family:inherit; outline:none;">
    <span style="color:#555; font-size:11px;">to</span>
    <input type="date" id="tlTo" onchange="onTlDateChange()" style="padding:7px 12px; border-radius:12px; border:1px solid #1e1e2e; background:#111119; color:#ddd; font-size:12px; font-family:inherit; outline:none;">
  </div>

  <div id="legend"></div>
  <div id="stats"></div>

  <div id="sidebar">
    <button class="close-btn" onclick="closeSidebar()">&times;</button>
    <h2 id="sidebarTitle"></h2>
    <div class="meta" id="sidebarMeta"></div>
    <div class="section-title">Connected topics</div>
    <div id="relatedChips"></div>
    <div class="section-title" style="margin-top:20px">Documents</div>
    <ul class="doc-list" id="docList"></ul>
  </div>

  <div class="tooltip" id="tooltip"></div>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script>
    // Password gate using SHA-256 hash comparison
    const HASH = '1b1dc3f3b5599270eaef6fd2c6b1dcac6b5dd6919fb8c3605186466e922d3057';

    async function sha256(str) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
    }

    document.getElementById('gateInput').addEventListener('keydown', async (e) => {
      if (e.key !== 'Enter') return;
      const hash = await sha256(e.target.value);
      if (hash === HASH) {
        document.getElementById('gate').classList.add('hidden');
        init();
      } else {
        document.getElementById('gateError').textContent = 'Wrong password';
        e.target.value = '';
      }
    });

    let graphData, simulation, svg, g, nodeEls, linkEls, labelEls, clusterLabels;
    let docMap = {};
    let currentView = 'graph';
    const hiddenCategories = new Set();
    const selectedCategories = new Set();  // empty = show all, non-empty = show only these

    const width = window.innerWidth;
    const height = window.innerHeight;

    // Category colors
    const catColors = {
      posture:   '#a78bfa',
      automation:'#6366f1',
      strategy:  '#3b82f6',
      ux:        '#06b6d4',
      team:      '#14b8a6',
      teaching:  '#f59e0b',
      personal:  '#f472b6',
      code:      '#34d399',
      other:     '#6b7280',
    };

    const catLabels = {
      posture: 'Posture & Coverage',
      automation: 'Automation & AI',
      strategy: 'Strategy & Planning',
      ux: 'UX & Design',
      team: 'Team & Meetings',
      teaching: 'Teaching & Education',
      personal: 'Personal',
      code: 'Code & Engineering',
    };

    // Category cluster positions (radial layout)
    const catAngles = {
      posture: -Math.PI / 4,
      automation: -Math.PI / 2,
      strategy: -3 * Math.PI / 4,
      ux: Math.PI,
      team: 3 * Math.PI / 4,
      teaching: Math.PI / 2,
      personal: Math.PI / 4,
      code: 0,
      other: 0,
    };

    async function init() {
      const resp = await fetch('graph.json');
      graphData = await resp.json();
      graphData.documents.forEach(d => docMap[d.id] = d);

      document.getElementById('headerSub').textContent = `Knowledge graph of ${graphData.documents.length} documents`;
      updateDocCount();
      document.getElementById('stats').textContent =
        `${graphData.nodes.length} topics / ${graphData.edges.length} connections / ${graphData.documents.length} documents`;

      svg = d3.select('#canvas').attr('width', width).attr('height', height);
      const zoom = d3.zoom().scaleExtent([0.3, 4])
        .on('zoom', (e) => g.attr('transform', e.transform));
      svg.call(zoom);
      g = svg.append('g');

      // Defs for glow
      const defs = svg.append('defs');
      const filter = defs.append('filter').attr('id', 'glow');
      filter.append('feGaussianBlur').attr('stdDeviation', '3').attr('result', 'blur');
      filter.append('feMerge').selectAll('feMergeNode')
        .data(['blur', 'SourceGraphic']).join('feMergeNode').attr('in', d => d);

      render();
      buildLegend();
      buildOverview();
      buildCatFilters();
      setupSearch();
    }

    function buildCatFilters() {
      const cats = [...new Set(graphData.nodes.map(n => n.category))];
      const order = ['posture','automation','strategy','ux','team','teaching','code','personal','other'];
      cats.sort((a,b) => order.indexOf(a) - order.indexOf(b));
      document.getElementById('catFilters').innerHTML = cats.map(c =>
        `<div class="cat-filter" id="cf-${c}" onclick="toggleCatFilter('${c}')">
          <div class="cf-dot" style="background:${catColors[c]}"></div>${catLabels[c] || c}
        </div>`
      ).join('');
    }

    function toggleCatFilter(cat) {
      // Multi-select: toggle this category on/off
      if (selectedCategories.has(cat)) {
        selectedCategories.delete(cat);
      } else {
        selectedCategories.add(cat);
      }
      // Rebuild hiddenCategories: if any selected, hide all others
      hiddenCategories.clear();
      if (selectedCategories.size > 0) {
        const allCats = [...new Set(graphData.nodes.map(n => n.category))];
        allCats.forEach(c => { if (!selectedCategories.has(c)) hiddenCategories.add(c); });
      }
      // Update chip styles
      document.querySelectorAll('.cat-filter').forEach(el => {
        const c = el.id.replace('cf-', '');
        el.classList.toggle('active', selectedCategories.has(c));
        el.classList.toggle('dimmed', selectedCategories.size > 0 && !selectedCategories.has(c));
      });
      refreshCurrentView();
    }

    function refreshCurrentView() {
      updateDocCount();
      if (currentView === 'graph') { if (simulation) simulation.stop(); render(); }
      else if (currentView === 'timeline') { renderTimeline(); }
      else if (currentView === 'report') { updateReport(); }
      else if (currentView === 'projects') { renderProjects(); }
    }

    function toggleSection(id) {
      const body = document.getElementById(id);
      const arrow = document.querySelector(`[data-toggle="${id}"]`);
      if (!body) return;
      body.classList.toggle('collapsed');
      if (arrow) arrow.classList.toggle('collapsed');
    }

    function isNodeVisible(n) { return !hiddenCategories.has(n.category); }
    function isDocVisible(docId) {
      return graphData.nodes.some(n => (n.doc_ids || []).includes(docId) && isNodeVisible(n));
    }

    function updateDocCount() {
      if (!graphData) return;
      const visNodes = graphData.nodes.filter(isNodeVisible);
      const visDocIds = new Set();
      visNodes.forEach(n => (n.doc_ids || []).forEach(id => visDocIds.add(id)));
      document.getElementById('stats').textContent =
        `${visNodes.length} topics / ${graphData.edges.length} connections / ${visDocIds.size} documents`;
    }

    function render() {
      g.selectAll('*').remove();
      const nodes = graphData.nodes.filter(isNodeVisible);
      const visibleIds = new Set(nodes.map(n => n.id));
      const edges = graphData.edges.filter(e => {
        const s = typeof e.source === 'object' ? e.source.id : e.source;
        const t = typeof e.target === 'object' ? e.target.id : e.target;
        return visibleIds.has(s) && visibleIds.has(t);
      });

      const sizeScale = d3.scaleSqrt()
        .domain([d3.min(nodes, n => n.doc_count), d3.max(nodes, n => n.doc_count)])
        .range([10, 42]);

      const edgeScale = d3.scaleLinear()
        .domain([d3.min(edges, e => e.weight) || 1, d3.max(edges, e => e.weight) || 1])
        .range([0.3, 2]);

      // Cluster force: pull nodes toward their category's radial position
      const clusterRadius = Math.min(width, height) * 0.35;
      function clusterForce(alpha) {
        nodes.forEach(n => {
          const angle = catAngles[n.category] || 0;
          const tx = width / 2 + Math.cos(angle) * clusterRadius;
          const ty = height / 2 + Math.sin(angle) * clusterRadius;
          n.vx += (tx - n.x) * alpha * 0.12;
          n.vy += (ty - n.y) * alpha * 0.12;
        });
      }

      simulation = d3.forceSimulation(nodes)
        .force('link', d3.forceLink(edges).id(d => d.id).distance(120).strength(e => e.weight * 0.01))
        .force('charge', d3.forceManyBody().strength(d => -200 - d.doc_count * 30))
        .force('center', d3.forceCenter(width / 2, height / 2).strength(0.02))
        .force('collision', d3.forceCollide().radius(d => sizeScale(d.doc_count) + 35).strength(1))
        .force('cluster', clusterForce);

      // Edges
      linkEls = g.append('g')
        .selectAll('line')
        .data(edges)
        .join('line')
        .attr('stroke', d => {
          const sNode = nodes.find(n => n.id === (typeof d.source === 'object' ? d.source.id : d.source));
          return sNode ? catColors[sNode.category] || '#333' : '#333';
        })
        .attr('stroke-width', d => edgeScale(d.weight))
        .attr('stroke-opacity', 0.08);

      // Category group labels (floating behind nodes)
      const catCenters = {};
      const catCounts = {};
      nodes.forEach(n => {
        const cat = n.category || 'other';
        if (!catCenters[cat]) { catCenters[cat] = { x: 0, y: 0, count: 0, docs: 0 }; }
        const angle = catAngles[cat] || 0;
        catCenters[cat].x = width / 2 + Math.cos(angle) * clusterRadius;
        catCenters[cat].y = height / 2 + Math.sin(angle) * clusterRadius;
        catCenters[cat].count++;
        catCenters[cat].docs += n.doc_count;
      });

      // Place category labels at the outer edge of each cluster zone
      clusterLabels = g.append('g').attr('class', 'cluster-labels')
        .selectAll('g')
        .data(Object.entries(catCenters))
        .join('g')
        .attr('transform', ([cat, c]) => {
          const angle = catAngles[cat] || 0;
          const lx = width / 2 + Math.cos(angle) * clusterRadius * 1.55;
          const ly = height / 2 + Math.sin(angle) * clusterRadius * 1.55;
          return `translate(${lx},${ly})`;
        });

      clusterLabels.append('text')
        .text(([cat]) => catLabels[cat] || cat)
        .attr('text-anchor', 'middle')
        .attr('font-size', 13)
        .attr('font-weight', 700)
        .attr('fill', ([cat]) => catColors[cat] || '#555')
        .attr('fill-opacity', 0.35)
        .style('pointer-events', 'none')
        .style('text-transform', 'uppercase')
        .style('letter-spacing', '2px');

      // Node groups
      const nodeGroup = g.append('g').selectAll('g').data(nodes).join('g')
        .style('cursor', 'pointer')
        .on('mouseover', onNodeHover)
        .on('mouseout', onNodeOut)
        .on('click', onNodeClick)
        .call(d3.drag().on('start', dragStart).on('drag', dragging).on('end', dragEnd));

      // Outer glow circle
      nodeGroup.append('circle')
        .attr('r', d => sizeScale(d.doc_count) + 4)
        .attr('fill', d => catColors[d.category] || '#555')
        .attr('opacity', 0.08)
        .attr('filter', 'url(#glow)');

      // Main circle
      nodeEls = nodeGroup.append('circle')
        .attr('r', d => sizeScale(d.doc_count))
        .attr('fill', d => catColors[d.category] || '#555')
        .attr('fill-opacity', 0.7)
        .attr('stroke', d => catColors[d.category] || '#555')
        .attr('stroke-width', 1.5)
        .attr('stroke-opacity', 0.4);

      // Labels — only show for nodes with >= 5 docs; small ones appear on hover
      function truncate(s, max) { return s.length > max ? s.slice(0, max - 1) + '...' : s; }
      labelEls = nodeGroup.append('text')
        .text(d => truncate(d.name, 28))
        .attr('class', 'node-label')
        .attr('font-size', d => Math.max(10, Math.min(13, 8 + d.doc_count * 0.3)))
        .attr('fill', '#ddd')
        .attr('font-weight', d => d.doc_count >= 10 ? 600 : 400)
        .attr('text-anchor', 'middle')
        .attr('dy', d => -sizeScale(d.doc_count) - 8)
        .attr('opacity', d => d.doc_count >= 5 ? 0.9 : 0)
        .style('pointer-events', 'none')
        .style('text-shadow', '0 0 6px #0a0a0f, 0 0 12px #0a0a0f, 0 0 20px #0a0a0f');

      // Doc count badge
      nodeGroup.append('text')
        .text(d => d.doc_count)
        .attr('font-size', d => Math.max(8, sizeScale(d.doc_count) * 0.55))
        .attr('fill', '#fff')
        .attr('text-anchor', 'middle')
        .attr('dominant-baseline', 'central')
        .attr('font-weight', 600)
        .style('pointer-events', 'none');

      simulation.on('tick', () => {
        linkEls
          .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
          .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
        nodeGroup.attr('transform', d => `translate(${d.x},${d.y})`);
      });
    }

    function onNodeHover(event, d) {
      const tooltip = document.getElementById('tooltip');
      tooltip.style.display = 'block';
      tooltip.style.left = (event.clientX + 14) + 'px';
      tooltip.style.top = (event.clientY - 10) + 'px';
      tooltip.innerHTML = `${d.name} <span class="tt-count">${d.doc_count} docs</span>`;

      const connected = new Set();
      graphData.edges.forEach(e => {
        const s = typeof e.source === 'object' ? e.source.id : e.source;
        const t = typeof e.target === 'object' ? e.target.id : e.target;
        if (s === d.id) connected.add(t);
        if (t === d.id) connected.add(s);
      });

      // Dim unrelated nodes, show all labels for connected nodes
      g.selectAll('g > g').each(function(n) {
        const isRelevant = n.id === d.id || connected.has(n.id);
        d3.select(this).attr('opacity', isRelevant ? 1 : 0.12);
        d3.select(this).select('.node-label').attr('opacity', isRelevant ? 1 : 0);
      });
      linkEls.attr('stroke-opacity', e => {
        const s = typeof e.source === 'object' ? e.source.id : e.source;
        const t = typeof e.target === 'object' ? e.target.id : e.target;
        return s === d.id || t === d.id ? 0.35 : 0.02;
      });
    }

    function onNodeOut() {
      document.getElementById('tooltip').style.display = 'none';
      g.selectAll('g > g').attr('opacity', 1);
      // Restore label visibility based on doc count
      g.selectAll('.node-label').attr('opacity', d => d.doc_count >= 5 ? 0.9 : 0);
      linkEls.attr('stroke-opacity', 0.08);
    }

    function onNodeClick(event, d) { openSidebar(d); }

    function openSidebar(topic) {
      document.getElementById('sidebarTitle').textContent = topic.name;
      document.getElementById('sidebarMeta').innerHTML =
        `<span style="color:${catColors[topic.category]}">${catLabels[topic.category] || topic.category}</span> &middot; ${topic.doc_count} documents`;

      // Docs
      const docs = (topic.doc_ids || []).map(id => docMap[id]).filter(Boolean)
        .sort((a, b) => (b.created_at || '').localeCompare(a.created_at || ''));
      document.getElementById('docList').innerHTML = docs.map(d => `
        <li onclick="window.open('${d.source_url || '#'}', '_blank')">
          <div class="doc-title">${d.title}</div>
          <div class="doc-meta">${d.source}${d.created_at ? ' &middot; ' + d.created_at.split('T')[0] : ''}</div>
        </li>
      `).join('');

      // Related topics
      const related = new Map();
      graphData.edges.forEach(e => {
        const s = typeof e.source === 'object' ? e.source.id : e.source;
        const t = typeof e.target === 'object' ? e.target.id : e.target;
        if (s === topic.id) related.set(t, e.weight);
        if (t === topic.id) related.set(s, e.weight);
      });

      const nodeMap = {};
      graphData.nodes.forEach(n => nodeMap[n.id] = n);

      const sorted = [...related.entries()].sort((a, b) => b[1] - a[1]);
      document.getElementById('relatedChips').innerHTML = sorted.map(([id, w]) => {
        const n = nodeMap[id];
        if (!n) return '';
        return `<span class="topic-chip" style="border-color:${catColors[n.category]}44"
          onclick="openSidebar(graphData.nodes.find(x=>x.id===${id}))">${n.name}<span class="count">${w}</span></span>`;
      }).join('');

      document.getElementById('sidebar').classList.add('open');
    }

    function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); }

    function buildLegend() {
      const cats = new Set(graphData.nodes.map(n => n.category));
      document.getElementById('legend').innerHTML = [...cats].map(c =>
        `<div class="legend-item" onclick="highlightCategory('${c}')">
          <div class="legend-dot" style="background:${catColors[c]}"></div>${catLabels[c] || c}
        </div>`
      ).join('');
    }

    function buildOverview() {
      // Group nodes by category, compute stats
      const cats = {};
      graphData.nodes.forEach(n => {
        const cat = n.category || 'other';
        if (!cats[cat]) cats[cat] = { topics: [], totalDocs: 0 };
        cats[cat].topics.push(n);
        cats[cat].totalDocs += n.doc_count;
      });

      // Sort categories by total docs
      const sorted = Object.entries(cats).sort((a, b) => b[1].totalDocs - a[1].totalDocs);

      document.getElementById('overviewContent').innerHTML = sorted.map(([cat, data], i) => {
        const sid = 'ov-' + i;
        const topTopics = data.topics
          .sort((a, b) => b.doc_count - a.doc_count)
          .slice(0, 4)
          .map(t => `<span>${t.name}</span> (${t.doc_count})`)
          .join(', ');

        return `
          <div class="overview-cat">
            <div class="cat-header" onclick="toggleSection('${sid}')" style="cursor:pointer">
              <span class="collapse-arrow collapsed" data-toggle="${sid}" style="font-size:9px;color:#555;transition:transform 0.2s">&#9660;</span>
              <div class="cat-dot" style="background:${catColors[cat]}"></div>
              <div class="cat-name">${catLabels[cat] || cat}</div>
              <div class="cat-count">${data.totalDocs} docs</div>
            </div>
            <div id="${sid}" class="collapsible-body collapsed" style="max-height:400px">
              <div class="cat-topics" style="margin-top:6px">${topTopics}</div>
            </div>
          </div>`;
      }).join('');
    }

    function toggleOverview() {
      const panel = document.getElementById('overview');
      const btn = document.getElementById('overview-toggle');
      const isVisible = panel.classList.toggle('visible');
      btn.classList.toggle('active', isVisible);
    }

    function highlightCategory(cat) {
      // Close overview for cleaner view
      document.getElementById('overview').classList.remove('visible');
      document.getElementById('overview-toggle').classList.remove('active');

      g.selectAll('g > g').each(function(n) {
        d3.select(this).attr('opacity', n.category === cat ? 1 : 0.12);
      });
      linkEls.attr('stroke-opacity', e => {
        const s = typeof e.source === 'object' ? e.source : { id: e.source };
        const t = typeof e.target === 'object' ? e.target : { id: e.target };
        const sNode = graphData.nodes.find(n => n.id === s.id);
        const tNode = graphData.nodes.find(n => n.id === t.id);
        return (sNode?.category === cat && tNode?.category === cat) ? 0.25 : 0.02;
      });

      // Also highlight the cluster label
      clusterLabels.select('text')
        .attr('fill-opacity', ([c]) => c === cat ? 0.6 : 0.08);

      // Reset after 4s
      setTimeout(() => {
        g.selectAll('g > g').attr('opacity', 1);
        linkEls.attr('stroke-opacity', 0.08);
        clusterLabels.select('text').attr('fill-opacity', 0.25);
      }, 4000);
    }

    let searchSourceFilter = 'all';

    function setSearchFilter(btn) {
      document.querySelectorAll('#search .filter-chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      searchSourceFilter = btn.dataset.source;
      // Re-trigger search
      document.getElementById('searchInput').dispatchEvent(new Event('input'));
    }

    function setupSearch() {
      const input = document.getElementById('searchInput');
      const results = document.getElementById('searchResults');
      input.addEventListener('input', () => {
        let q = input.value.toLowerCase().trim();
        if (q.length < 2) { results.classList.remove('visible'); return; }

        const sf = searchSourceFilter;

        // Handle status: prefix — show matching projects
        if (q.startsWith('status:')) {
          const status = q.split(':')[1].trim();
          const projMatches = (graphData.projects || [])
            .filter(p => p.status.toLowerCase().includes(status))
            .slice(0, 8);
          if (!projMatches.length) { results.classList.remove('visible'); return; }
          let html = '<div class="result-section">Projects by status</div>';
          html += projMatches.map(p =>
            `<div class="result-item" onclick="openProjectSidebar(${p.id})">
              <span class="pc-status ps-${p.status}" style="display:inline-block;margin-right:6px">${p.status}</span>
              ${p.name} <span style="color:#555">(${p.doc_count} docs)</span>
            </div>`
          ).join('');
          results.innerHTML = html;
          results.classList.add('visible');
          return;
        }

        // Handle jira: / github: prefix — search project links
        let linkPrefix = null;
        for (const pfx of ['jira:', 'github:']) {
          if (q.startsWith(pfx)) {
            linkPrefix = pfx.replace(':', '');
            q = q.slice(pfx.length).trim();
            break;
          }
        }

        if (linkPrefix) {
          const linkMatches = [];
          (graphData.projects || []).forEach(p => {
            (p.links || []).forEach(l => {
              if (!l.source_type.includes(linkPrefix)) return;
              if (q && !l.title.toLowerCase().includes(q) && !(l.source_id || '').toLowerCase().includes(q)) return;
              linkMatches.push({...l, projectName: p.name, projectId: p.id});
            });
          });
          if (!linkMatches.length) { results.classList.remove('visible'); return; }
          let html = `<div class="result-section">${linkPrefix === 'jira' ? 'Jira Tickets' : 'GitHub Items'}</div>`;
          html += linkMatches.slice(0, 8).map(l => {
            const statusColor = l.status === 'Done' || l.status === 'Merged' ? '#4ade80' : l.status === 'In Progress' || l.status === 'Open' ? '#60a5fa' : '#888';
            return `<div class="result-item" onclick="window.open('${l.url}', '_blank')">
              <span style="color:${statusColor};font-size:10px;font-weight:600">${l.status || '?'}</span>
              ${l.source_id} — ${l.title}
              <div class="result-snippet">${l.projectName}</div>
            </div>`;
          }).join('');
          results.innerHTML = html;
          results.classList.add('visible');
          return;
        }

        // Search topics
        const topicMatches = graphData.nodes.filter(n => n.name.toLowerCase().includes(q)).slice(0, 5);

        // Search documents by title + snippet, with source filter
        let filteredDocs = graphData.documents;
        if (sf !== 'all' && sf !== 'jira' && sf !== 'github') {
          filteredDocs = filteredDocs.filter(d => d.source === sf);
        }
        const docMatches = filteredDocs.filter(d =>
          d.title.toLowerCase().includes(q) ||
          (d.snippet && d.snippet.toLowerCase().includes(q))
        ).slice(0, 6);

        // Search projects by name
        const projMatches = (graphData.projects || []).filter(p =>
          p.name.toLowerCase().includes(q)
        ).slice(0, 4);

        // Search links when filter is jira or github
        let linkMatches = [];
        if (sf === 'jira' || sf === 'github') {
          (graphData.projects || []).forEach(p => {
            (p.links || []).forEach(l => {
              if (!l.source_type.includes(sf)) return;
              if (l.title.toLowerCase().includes(q) || (l.source_id || '').toLowerCase().includes(q))
                linkMatches.push({...l, projectName: p.name, projectId: p.id});
            });
          });
          linkMatches = linkMatches.slice(0, 6);
        }

        if (!topicMatches.length && !docMatches.length && !projMatches.length && !linkMatches.length) {
          results.classList.remove('visible'); return;
        }

        let html = '';
        if (topicMatches.length) {
          html += '<div class="result-section">Topics</div>';
          html += topicMatches.map(n =>
            `<div class="result-item" onclick="focusNode(${n.id})">${n.name} <span style="color:#6366f1">(${n.doc_count})</span></div>`
          ).join('');
        }
        if (projMatches.length) {
          html += '<div class="result-section">Projects</div>';
          html += projMatches.map(p =>
            `<div class="result-item" onclick="openProjectSidebar(${p.id})">
              ${p.name}
              <span class="pc-status ps-${p.status}" style="display:inline-block;margin-left:6px;font-size:9px">${p.status}</span>
              ${p.phase ? `<span class="pc-phase pp-${p.phase.toLowerCase()}" style="display:inline-block;margin-left:4px;font-size:9px">${p.phase}</span>` : ''}
            </div>`
          ).join('');
        }
        if (docMatches.length) {
          html += '<div class="result-section">Documents</div>';
          html += docMatches.map(d => {
            const date = d.created_at ? d.created_at.split('T')[0] : '';
            const snippet = d.snippet || '';
            return `<div class="result-item" onclick="window.open('${d.source_url || '#'}', '_blank')">
              ${d.title} <span style="color:#555">${date}</span>
              ${snippet ? `<div class="result-snippet">${snippet.substring(0, 80)}...</div>` : ''}
            </div>`;
          }).join('');
        }
        if (linkMatches.length) {
          html += `<div class="result-section">${sf === 'jira' ? 'Jira Tickets' : 'GitHub Items'}</div>`;
          html += linkMatches.map(l => {
            const statusColor = l.status === 'Done' || l.status === 'Merged' ? '#4ade80' : l.status === 'Open' || l.status === 'In Progress' ? '#60a5fa' : '#888';
            return `<div class="result-item" onclick="window.open('${l.url}', '_blank')">
              <span style="color:${statusColor};font-size:10px;font-weight:600">${l.status || '?'}</span>
              ${l.source_id} — ${l.title}
              <div class="result-snippet">${l.projectName}</div>
            </div>`;
          }).join('');
        }

        results.innerHTML = html;
        results.classList.add('visible');
      });
      input.addEventListener('blur', () => setTimeout(() => results.classList.remove('visible'), 200));
    }

    function focusNode(id) {
      const node = graphData.nodes.find(n => n.id === id);
      if (!node || !node.x) return;
      document.getElementById('searchInput').value = '';
      document.getElementById('searchResults').classList.remove('visible');
      const transform = d3.zoomIdentity.translate(width/2, height/2).scale(2).translate(-node.x, -node.y);
      svg.transition().duration(750).call(
        d3.zoom().scaleExtent([0.3, 4]).on('zoom', e => g.attr('transform', e.transform)).transform, transform
      );
      openSidebar(node);
    }

    function dragStart(e, d) { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; }
    function dragging(e, d) { d.fx = e.x; d.fy = e.y; }
    function dragEnd(e, d) { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }

    // ── Timeline View ──────────────────────────────────────────

    function switchView(view) {
      if (view === currentView) return;
      currentView = view;

      document.getElementById('graphBtn').classList.toggle('active', view === 'graph');
      document.getElementById('timelineBtn').classList.toggle('active', view === 'timeline');
      document.getElementById('reportBtn').classList.toggle('active', view === 'report');
      document.getElementById('projectsBtn').classList.toggle('active', view === 'projects');

      const isOverlay = view === 'report' || view === 'projects';
      document.getElementById('legend').style.display = view === 'graph' ? 'flex' : 'none';
      document.getElementById('stats').style.display = isOverlay ? 'none' : 'block';
      document.getElementById('timelineControls').style.display = view === 'timeline' ? 'flex' : 'none';

      document.getElementById('canvas').style.display = isOverlay ? 'none' : 'block';
      document.getElementById('reportView').classList.toggle('visible', view === 'report');
      document.getElementById('projectsView').classList.toggle('visible', view === 'projects');

      if (view === 'report') {
        if (simulation) simulation.stop();
        updateReport();
      } else if (view === 'projects') {
        if (simulation) simulation.stop();
        renderProjects();
      } else {
        // Reset zoom
        svg.call(d3.zoom().scaleExtent([0.3, 4]).on('zoom', e => g.attr('transform', e.transform))
          .transform, d3.zoomIdentity);

        if (view === 'graph') {
          if (simulation) simulation.stop();
          render();
        } else {
          if (simulation) simulation.stop();
          renderTimeline();
        }
      }

      closeSidebar();
    }

    let tlStart = null, tlEnd = null;

    function applyTimelinePreset() {
      const val = parseInt(document.getElementById('timelineRange').value);
      tlEnd = new Date();
      if (val === 0) {
        const allDates = graphData.documents.map(d => d.created_at ? new Date(d.created_at) : null).filter(Boolean);
        tlStart = d3.min(allDates) || new Date('2020-01-01');
      } else {
        tlStart = new Date();
        tlStart.setDate(tlStart.getDate() - val);
      }
      document.getElementById('tlFrom').value = toLocalDateStr(tlStart);
      document.getElementById('tlTo').value = toLocalDateStr(tlEnd);
      renderTimeline();
    }

    function onTlDateChange() {
      const from = document.getElementById('tlFrom').value;
      const to = document.getElementById('tlTo').value;
      if (!from || !to) return;
      tlStart = new Date(from);
      tlEnd = new Date(to);
      renderTimeline();
    }

    function renderTimeline() {
      g.selectAll('*').remove();

      // Initialize date range on first call
      if (!tlStart) applyTimelinePreset();

      const margin = { top: 40, right: 40, bottom: 50, left: 240 };
      const w = width - margin.left - margin.right;
      const h = height - margin.top - margin.bottom;

      // Filter docs to date range
      const filteredDocIds = new Set();
      graphData.documents.forEach(d => {
        if (!d.created_at) return;
        const date = new Date(d.created_at);
        if (date >= tlStart && date <= tlEnd) filteredDocIds.add(d.id);
      });

      // Only show nodes that have docs in range and are in visible categories
      const catOrder = ['posture', 'automation', 'strategy', 'ux', 'team', 'teaching', 'code', 'personal', 'other'];
      const sorted = graphData.nodes
        .filter(n => isNodeVisible(n) && (n.doc_ids || []).some(id => filteredDocIds.has(id)))
        .sort((a, b) => {
          const ca = catOrder.indexOf(a.category), cb = catOrder.indexOf(b.category);
          if (ca !== cb) return ca - cb;
          return b.doc_count - a.doc_count;
        });

      // Time scale based on selected range
      const xScale = d3.scaleTime()
        .domain([tlStart, tlEnd])
        .range([margin.left, width - margin.right]);

      // Y scale: one band per topic
      const rowHeight = Math.min(28, h / sorted.length);
      const totalHeight = rowHeight * sorted.length;
      const yStart = margin.top + Math.max(0, (h - totalHeight) / 2);

      const tg = g.append('g');

      // Draw category headers + swim lanes
      let lastCat = null;
      sorted.forEach((node, i) => {
        const y = yStart + i * rowHeight;

        // Category header
        if (node.category !== lastCat) {
          lastCat = node.category;
          // Category separator line
          if (i > 0) {
            tg.append('line')
              .attr('x1', margin.left - 10).attr('x2', width - margin.right)
              .attr('y1', y - 2).attr('y2', y - 2)
              .attr('stroke', catColors[node.category] || '#333')
              .attr('stroke-opacity', 0.15);
          }
        }

        // Alternating row shading
        tg.append('rect')
          .attr('x', margin.left - 10)
          .attr('y', y)
          .attr('width', w + 20)
          .attr('height', rowHeight)
          .attr('fill', i % 2 === 0 ? 'rgba(255,255,255,0.015)' : 'transparent');

        // Topic label on the left
        tg.append('text')
          .text(node.name)
          .attr('x', margin.left - 16)
          .attr('y', y + rowHeight / 2)
          .attr('text-anchor', 'end')
          .attr('dominant-baseline', 'central')
          .attr('font-size', Math.min(11, rowHeight * 0.45))
          .attr('fill', catColors[node.category] || '#888')
          .attr('fill-opacity', node.doc_count >= 5 ? 0.9 : 0.5)
          .attr('font-weight', node.doc_count >= 10 ? 600 : 400)
          .style('cursor', 'pointer')
          .on('click', () => openSidebar(node));
      });

      // X axis
      const xAxis = d3.axisBottom(xScale)
        .ticks(d3.timeMonth.every(1))
        .tickFormat(d3.timeFormat('%b %Y'));

      tg.append('g')
        .attr('transform', `translate(0, ${yStart + totalHeight + 10})`)
        .call(xAxis)
        .selectAll('text')
          .attr('fill', '#555')
          .attr('font-size', 10)
          .attr('transform', 'rotate(-30)')
          .attr('text-anchor', 'end');
      tg.selectAll('.domain, .tick line').attr('stroke', '#1e1e2e');

      // Month grid lines
      const ticks = xScale.ticks(d3.timeMonth.every(1));
      ticks.forEach(t => {
        tg.append('line')
          .attr('x1', xScale(t)).attr('x2', xScale(t))
          .attr('y1', yStart - 5).attr('y2', yStart + totalHeight)
          .attr('stroke', '#1e1e2e').attr('stroke-opacity', 0.5);
      });

      // Build a map: nodeIndex -> node for fast lookup
      const nodeIndexMap = {};
      sorted.forEach((node, i) => nodeIndexMap[node.id] = i);

      // Draw dots: one per (doc, topic) pair, filtered to date range
      const dots = [];
      sorted.forEach((node, i) => {
        (node.doc_ids || []).forEach(docId => {
          if (!filteredDocIds.has(docId)) return;
          const doc = docMap[docId];
          if (!doc || !doc.created_at) return;
          dots.push({ node, nodeIndex: i, doc, date: new Date(doc.created_at) });
        });
      });

      tg.selectAll('circle.dot')
        .data(dots)
        .join('circle')
        .attr('class', 'dot')
        .attr('cx', d => xScale(d.date))
        .attr('cy', d => yStart + d.nodeIndex * rowHeight + rowHeight / 2)
        .attr('r', 4)
        .attr('fill', d => catColors[d.node.category] || '#555')
        .attr('fill-opacity', 0.7)
        .attr('stroke', d => catColors[d.node.category] || '#555')
        .attr('stroke-width', 1)
        .attr('stroke-opacity', 0.3)
        .style('cursor', 'pointer')
        .on('mouseover', (event, d) => {
          const tooltip = document.getElementById('tooltip');
          tooltip.style.display = 'block';
          tooltip.style.left = (event.clientX + 14) + 'px';
          tooltip.style.top = (event.clientY - 10) + 'px';
          tooltip.innerHTML = `<strong>${d.doc.title}</strong><br>
            <span style="color:#555">${d.date.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' })}</span>
            <span class="tt-count">${d.node.name}</span>`;
          d3.select(event.target).attr('r', 6).attr('fill-opacity', 1);
        })
        .on('mouseout', (event) => {
          document.getElementById('tooltip').style.display = 'none';
          d3.select(event.target).attr('r', 4).attr('fill-opacity', 0.7);
        })
        .on('click', (event, d) => openSidebar(d.node));
    }

    // ── Report View ──────────────────────────────────────────

    function toLocalDateStr(d) {
      return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    }

    function applyPreset() {
      const days = parseInt(document.getElementById('reportRange').value);
      const end = new Date();
      const start = new Date();
      start.setDate(start.getDate() - days);
      document.getElementById('reportFrom').value = toLocalDateStr(start);
      document.getElementById('reportTo').value = toLocalDateStr(end);
      renderReport(start, end);
    }

    function onDateInputChange() {
      const from = document.getElementById('reportFrom').value;
      const to = document.getElementById('reportTo').value;
      if (!from || !to) return;
      renderReport(new Date(from), new Date(to));
    }

    function updateReport() {
      applyPreset();
    }

    function renderReport(startDate, endDate) {
      // Filter docs in date range
      const docs = graphData.documents.filter(d => {
        if (!d.created_at) return false;
        const date = new Date(d.created_at);
        return date >= startDate && date <= endDate;
      }).sort((a, b) => (b.created_at || '').localeCompare(a.created_at || ''));

      const startStr = startDate.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
      const endStr = endDate.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
      document.getElementById('reportSub').textContent = `${startStr} - ${endStr} (${docs.length} documents)`;

      if (!docs.length) {
        document.getElementById('reportContent').innerHTML = '<div class="report-empty">No documents found in this period.</div>';
        return;
      }

      // Build doc ID set for this period
      const docIdSet = new Set(docs.map(d => d.id));

      // Map docs to clusters via nodes
      // node -> docs in this period that belong to it
      const nodeDocMap = {};
      graphData.nodes.forEach(n => {
        const periodDocs = (n.doc_ids || []).filter(id => docIdSet.has(id));
        if (periodDocs.length > 0) {
          nodeDocMap[n.id] = periodDocs;
        }
      });

      // Group nodes by category (respecting filters)
      const catOrder = ['posture', 'automation', 'strategy', 'ux', 'team', 'teaching', 'code', 'personal', 'other'];
      const catGroups = {};
      graphData.nodes.forEach(n => {
        if (!nodeDocMap[n.id]) return;
        if (!isNodeVisible(n)) return;
        const cat = n.category || 'other';
        if (!catGroups[cat]) catGroups[cat] = [];
        catGroups[cat].push(n);
      });

      // Track which docs got categorized
      const categorizedDocs = new Set();

      let html = '';
      let sectionIdx = 0;
      catOrder.forEach(cat => {
        const nodes = catGroups[cat];
        if (!nodes || !nodes.length) return;

        // Sort clusters by doc count in period
        nodes.sort((a, b) => (nodeDocMap[b.id]?.length || 0) - (nodeDocMap[a.id]?.length || 0));

        // Deduplicate docs within this category: each doc shows only under its first (largest) cluster
        const seenInCat = new Set();

        const clusterHtmlParts = [];
        nodes.forEach(n => {
          const periodDocIds = (nodeDocMap[n.id] || []).filter(id => !seenInCat.has(id));
          if (!periodDocIds.length) return;

          periodDocIds.forEach(id => seenInCat.add(id));

          let clusterHtml = `<div class="report-cluster">
            <div class="report-cluster-name">${n.name}</div>`;

          periodDocIds.forEach(docId => {
            const doc = docMap[docId];
            if (!doc) return;
            categorizedDocs.add(docId);
            const date = doc.created_at ? new Date(doc.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '';
            const url = doc.source_url || '#';
            clusterHtml += `<div class="report-doc" onclick="window.open('${url}', '_blank')">
              <div class="doc-title">${doc.title}</div>
              <div class="doc-source">${doc.source}</div>
              <div class="doc-date">${date}</div>
            </div>`;
          });

          clusterHtml += `</div>`;
          clusterHtmlParts.push(clusterHtml);
        });

        if (!seenInCat.size) return;

        const sid = 'rpt-' + (sectionIdx++);
        html += `<div class="report-category">
          <div class="report-cat-header" onclick="toggleSection('${sid}')">
            <span class="collapse-arrow collapsed" data-toggle="${sid}">&#9660;</span>
            <div class="report-cat-dot" style="background:${catColors[cat]}"></div>
            <div class="report-cat-name">${catLabels[cat] || cat}</div>
            <div class="report-cat-count">${seenInCat.size} docs</div>
          </div>
          <div id="${sid}" class="collapsible-body collapsed" style="max-height:2000px">`;
        html += clusterHtmlParts.join('');
        html += `</div></div>`;
      });

      // Uncategorized docs
      const uncategorized = docs.filter(d => !categorizedDocs.has(d.id));
      if (uncategorized.length) {
        const sid = 'rpt-' + (sectionIdx++);
        html += `<div class="report-category">
          <div class="report-cat-header" onclick="toggleSection('${sid}')">
            <span class="collapse-arrow collapsed" data-toggle="${sid}">&#9660;</span>
            <div class="report-cat-dot" style="background:#6b7280"></div>
            <div class="report-cat-name">Uncategorized</div>
            <div class="report-cat-count">${uncategorized.length} docs</div>
          </div>
          <div id="${sid}" class="collapsible-body collapsed" style="max-height:2000px">
          <div class="report-cluster">`;
        uncategorized.forEach(doc => {
          const date = doc.created_at ? new Date(doc.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '';
          const url = doc.source_url || '#';
          html += `<div class="report-doc" onclick="window.open('${url}', '_blank')">
            <div class="doc-title">${doc.title}</div>
            <div class="doc-source">${doc.source}</div>
            <div class="doc-date">${date}</div>
          </div>`;
        });
        html += `</div></div></div>`;
      }

      document.getElementById('reportContent').innerHTML = html;
    }

    // ── Summary (project-grouped update) ─────────────────────

    let reportMode = 'topics';
    let lastSummaryMarkdown = '';

    function setReportMode(mode) {
      reportMode = mode;
      document.getElementById('reportModeTopics').classList.toggle('active', mode === 'topics');
      document.getElementById('reportModeUpdate').classList.toggle('active', mode === 'update');
      document.getElementById('copySummaryBtn').style.display = mode === 'update' ? 'inline-block' : 'none';
      onDateInputChange();
    }

    // Patch renderReport to dispatch
    const _origRenderReport = renderReport;
    renderReport = function(startDate, endDate) {
      if (reportMode === 'update') {
        renderUpdateSummary(startDate, endDate);
      } else {
        _origRenderReport(startDate, endDate);
      }
    };

    function renderUpdateSummary(startDate, endDate) {
      const startStr = startDate.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
      const endStr = endDate.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });

      // Count docs in range
      const periodDocs = graphData.documents.filter(d => {
        if (!d.created_at) return false;
        const date = new Date(d.created_at);
        return date >= startDate && date <= endDate;
      });

      document.getElementById('reportSub').textContent = `${startStr} - ${endStr} (${periodDocs.length} documents)`;

      // Check for cached AI summary
      const cached = (graphData.summaries || []).find(s =>
        s.start === toLocalDateStr(startDate) && s.end === toLocalDateStr(endDate)
      );

      if (cached) {
        document.getElementById('reportContent').innerHTML =
          `<div class="ai-summary">${markdownToHtml(cached.text)}</div>`;
        lastSummaryMarkdown = cached.text;
        return;
      }

      // No cached summary — show generate button
      const sinceArg = toLocalDateStr(startDate);
      const untilArg = toLocalDateStr(endDate);

      document.getElementById('reportContent').innerHTML = `
        <div style="text-align:center; padding:60px 20px;">
          <div style="font-size:36px; margin-bottom:16px; opacity:0.5;">&#9998;</div>
          <div style="font-size:16px; color:#ddd; margin-bottom:8px;">Generate an AI summary</div>
          <div style="font-size:13px; color:#666; margin-bottom:24px; max-width:460px; margin-left:auto; margin-right:auto;">
            Claude will analyze your ${periodDocs.length} documents and tickets from this period
            and write a concise work update grouped by project.
          </div>
          <button id="generateSummaryBtn" onclick="generateSummary('${sinceArg}', '${untilArg}')"
            style="padding:12px 28px; border-radius:14px; border:1px solid #6366f1; background:#12122a;
            color:#a78bfa; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit;
            transition:all 0.2s;">
            Generate Summary
          </button>
          <div id="summaryStatus" style="font-size:12px; color:#555; margin-top:16px; min-height:20px;"></div>
        </div>`;
      lastSummaryMarkdown = '';
    }

    function markdownToHtml(md) {
      // Minimal markdown -> HTML for summaries
      return md
        .replace(/^### (.+)$/gm, '<h3 style="font-size:16px;font-weight:600;color:#ddd;margin:20px 0 8px;">$1</h3>')
        .replace(/^## (.+)$/gm, '<h2 style="font-size:18px;font-weight:700;color:#fff;margin:24px 0 12px;">$1</h2>')
        .replace(/^\*\*(.+?)\*\*$/gm, '<div style="font-size:14px;font-weight:600;color:#ccc;margin:16px 0 6px;">$1</div>')
        .replace(/\*\*(.+?)\*\*/g, '<strong style="color:#ddd">$1</strong>')
        .replace(/^- (.+)$/gm, '<div style="padding:4px 0 4px 16px;font-size:13px;color:#aaa;border-left:2px solid #1e1e2e;margin:4px 0;">$1</div>')
        .replace(/^---$/gm, '<hr style="border:none;border-top:1px solid #1e1e2e;margin:20px 0;">')
        .replace(/`([^`]+)`/g, '<code style="background:#1e1e2e;padding:2px 6px;border-radius:4px;font-size:12px;color:#a78bfa">$1</code>')
        .replace(/\n\n/g, '<br>');
    }

    async function generateSummary(start, end) {
      const btn = document.getElementById('generateSummaryBtn');
      const status = document.getElementById('summaryStatus');
      btn.disabled = true;
      btn.style.opacity = '0.5';
      btn.textContent = 'Generating...';
      status.textContent = 'Claude is analyzing your work — this may take 15-30 seconds...';
      status.style.color = '#a78bfa';

      try {
        const resp = await fetch('/api/summary', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ start, end }),
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error || 'Server error');

        // Reload graph.json to get the cached summary
        const gResp = await fetch('graph.json?t=' + Date.now());
        graphData = await gResp.json();

        // Re-render — the summary is now cached
        const startDate = new Date(start);
        const endDate = new Date(end);
        renderUpdateSummary(startDate, endDate);
      } catch (err) {
        status.textContent = 'Error: ' + err.message;
        status.style.color = '#f87171';
        btn.disabled = false;
        btn.style.opacity = '1';
        btn.textContent = 'Retry';
      }
    }

    function copySummary() {
      if (!lastSummaryMarkdown) return;
      navigator.clipboard.writeText(lastSummaryMarkdown).then(() => {
        const btn = document.getElementById('copySummaryBtn');
        btn.textContent = 'Copied!';
        btn.style.color = '#4ade80';
        setTimeout(() => { btn.textContent = 'Copy as Markdown'; btn.style.color = '#a78bfa'; }, 1500);
      });
    }

    // ── Projects View ──────────────────────────────────────────

    function renderProjects() {
      const statusFilter = document.getElementById('projectsStatus').value;
      const phaseFilter = document.getElementById('projectsPhase').value;
      const sortBy = document.getElementById('projectsSort').value;

      let projects = (graphData.projects || [])
        .filter(p => !hiddenCategories.has(p.category))
        .filter(p => statusFilter === 'all' || p.status === statusFilter)
        .filter(p => phaseFilter === 'all' || p.phase === phaseFilter);

      // Sort
      if (sortBy === 'activity') {
        projects.sort((a, b) => (b.last_activity || '').localeCompare(a.last_activity || ''));
      } else if (sortBy === 'docs') {
        projects.sort((a, b) => b.doc_count - a.doc_count);
      } else {
        projects.sort((a, b) => a.name.localeCompare(b.name));
      }

      document.getElementById('projectsSub').textContent =
        `${projects.length} projects across ${graphData.documents.length} documents`;

      // Group by category
      const catOrder = ['posture','automation','strategy','ux','team','teaching','code','personal','other'];
      const catGroups = {};
      projects.forEach(p => {
        const cat = p.category || 'other';
        if (!catGroups[cat]) catGroups[cat] = [];
        catGroups[cat].push(p);
      });

      let html = '';
      let projSecIdx = 0;
      catOrder.forEach(cat => {
        const projs = catGroups[cat];
        if (!projs || !projs.length) return;

        const sid = 'prj-' + (projSecIdx++);
        html += `<div class="project-cat-section">
          <div class="project-cat-title" onclick="toggleSection('${sid}')">
            <span class="collapse-arrow collapsed" data-toggle="${sid}">&#9660;</span>
            <div class="pct-dot" style="background:${catColors[cat]}"></div>
            <span style="color:${catColors[cat]}">${catLabels[cat] || cat}</span>
            <span class="pct-count">${projs.length} projects</span>
          </div>
          <div id="${sid}" class="collapsible-body collapsed" style="max-height:4000px">
          <div class="project-grid">`;

        projs.forEach(p => {
          const startDate = p.start_date ? new Date(p.start_date).toLocaleDateString('en-US', {month:'short', year:'numeric'}) : '';
          const lastDate = p.last_activity ? new Date(p.last_activity).toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'}) : '';

          // Recent docs preview (last 3)
          const recentDocs = (p.doc_ids || [])
            .map(id => docMap[id])
            .filter(Boolean)
            .sort((a, b) => (b.created_at || '').localeCompare(a.created_at || ''))
            .slice(0, 3);

          const docsPreview = recentDocs.map(d =>
            `<div class="pc-doc-item">${d.title}</div>`
          ).join('');

          html += `<div class="project-card" onclick="openProjectSidebar(${p.id})">
            <div class="pc-top">
              <div class="pc-name">${p.name}</div>
              ${p.phase ? `<div class="pc-phase pp-${p.phase.toLowerCase()}">${p.phase}</div>` : ''}
              <div class="pc-status ps-${p.status}">${p.status}</div>
            </div>
            <div class="pc-stats">
              <span>${p.doc_count} docs</span>
              ${(p.links||[]).filter(l=>l.source_type==='jira').length ? `<span style="color:#60a5fa">${(p.links||[]).filter(l=>l.source_type==='jira').length} tickets</span>` : ''}
              ${(p.links||[]).filter(l=>l.source_type.startsWith('github')).length ? `<span style="color:#8b5cf6">${(p.links||[]).filter(l=>l.source_type.startsWith('github')).length} GH</span>` : ''}
            </div>
            <div class="pc-dates">
              ${startDate ? 'Since ' + startDate : ''}${lastDate ? ' · Last: ' + lastDate : ''}
            </div>
            ${docsPreview ? `<div class="pc-docs-preview">${docsPreview}</div>` : ''}
          </div>`;
        });

        html += `</div></div></div>`;
      });

      document.getElementById('projectsContent').innerHTML = html;
    }

    function openProjectSidebar(projectId) {
      const project = graphData.projects.find(p => p.id === projectId);
      if (!project) return;

      document.getElementById('sidebarTitle').textContent = project.name;
      document.getElementById('sidebarMeta').innerHTML =
        `<span style="color:${catColors[project.category]}">${catLabels[project.category] || project.category}</span>` +
        ` · <span class="pc-status ps-${project.status}" style="display:inline-block">${project.status}</span>` +
        (project.phase ? ` · <span class="pc-phase pp-${project.phase.toLowerCase()}" style="display:inline-block">${project.phase}</span>` : '') +
        ` · ${project.doc_count} documents`;

      // External links (Jira, GitHub)
      const links = project.links || [];
      const jiraLinks = links.filter(l => l.source_type === 'jira');
      const ghLinks = links.filter(l => l.source_type.startsWith('github'));
      let ticketHtml = '';

      function renderLinkList(items) {
        return items.map(l => {
          const statusColor = (l.status === 'Done' || l.status === 'Merged') ? '#4ade80'
            : (l.status === 'In Progress' || l.status === 'Open') ? '#60a5fa' : '#888';
          const icon = l.source_type.startsWith('github') ? 'GH' : 'JIRA';
          return `<li onclick="window.open('${l.url}', '_blank')">
            <div class="doc-title" style="display:flex;align-items:center;gap:8px">
              <span style="color:${statusColor};font-size:10px;font-weight:600;padding:2px 8px;border-radius:8px;background:${statusColor}15;white-space:nowrap">${l.status || 'To Do'}</span>
              <span style="font-size:9px;color:#555;font-weight:600">${icon}</span>
              ${l.source_id} — ${l.title}
            </div>
            <div class="doc-meta">${l.source_type}${l.priority ? ' · ' + l.priority : ''}${l.assignee ? ' · ' + l.assignee : ''}</div>
          </li>`;
        }).join('');
      }

      if (jiraLinks.length) ticketHtml += renderLinkList(jiraLinks);
      if (ghLinks.length) ticketHtml += renderLinkList(ghLinks);

      // Documents sorted by date
      const docs = (project.doc_ids || []).map(id => docMap[id]).filter(Boolean)
        .sort((a, b) => (b.created_at || '').localeCompare(a.created_at || ''));
      const docsHtml = docs.map(d => `
        <li onclick="window.open('${d.source_url || '#'}', '_blank')">
          <div class="doc-title">${d.title}</div>
          <div class="doc-meta">${d.source}${d.created_at ? ' · ' + d.created_at.split('T')[0] : ''}</div>
        </li>
      `).join('');

      const hasLinks = jiraLinks.length || ghLinks.length;
      let linkSectionTitle = '';
      if (jiraLinks.length && ghLinks.length) linkSectionTitle = 'Jira & GitHub';
      else if (jiraLinks.length) linkSectionTitle = 'Jira Tickets';
      else if (ghLinks.length) linkSectionTitle = 'GitHub';

      document.getElementById('docList').innerHTML =
        (hasLinks ? `<div class="section-title" style="margin:-4px 0 8px;font-size:11px;color:#60a5fa">${linkSectionTitle}</div>` + ticketHtml : '') +
        (hasLinks && docsHtml ? '<div class="section-title" style="margin:16px 0 8px">Documents</div>' : '') +
        docsHtml;

      // Related projects: those that share docs
      const sharedProjects = new Map();
      const myDocs = new Set(project.doc_ids || []);
      graphData.projects.forEach(other => {
        if (other.id === projectId) return;
        const shared = (other.doc_ids || []).filter(id => myDocs.has(id)).length;
        if (shared > 0) sharedProjects.set(other, shared);
      });

      const sortedRelated = [...sharedProjects.entries()].sort((a, b) => b[1] - a[1]).slice(0, 8);
      document.getElementById('relatedChips').innerHTML = sortedRelated.map(([p, count]) =>
        `<span class="topic-chip" style="border-color:${catColors[p.category]}44"
          onclick="openProjectSidebar(${p.id})">${p.name}<span class="count">${count}</span></span>`
      ).join('');

      document.getElementById('sidebar').classList.add('open');
    }

  </script>
</body>
</html>
