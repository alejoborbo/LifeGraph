<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LifeGraph</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0f; color: #e0e0e0; overflow: hidden; }
    #canvas { width: 100vw; height: 100vh; display: block; }

    /* Sidebar */
    #sidebar {
      position: fixed; top: 0; right: -420px; width: 420px; height: 100vh;
      background: #111119; border-left: 1px solid #1e1e2e;
      transition: right 0.3s ease; z-index: 10;
      overflow-y: auto; padding: 28px;
    }
    #sidebar.open { right: 0; }
    #sidebar h2 { font-size: 20px; margin-bottom: 4px; color: #fff; font-weight: 600; }
    #sidebar .meta { font-size: 13px; color: #666; margin-bottom: 20px; }
    #sidebar .section-title { font-size: 12px; color: #555; text-transform: uppercase; letter-spacing: 1px; margin: 20px 0 10px; }
    #sidebar .close-btn {
      position: absolute; top: 18px; right: 18px;
      background: none; border: none; color: #555; font-size: 22px; cursor: pointer;
    }
    #sidebar .close-btn:hover { color: #fff; }

    .topic-chip {
      display: inline-block; padding: 5px 12px; margin: 3px 4px 3px 0;
      border-radius: 14px; font-size: 12px; cursor: pointer;
      transition: all 0.15s; border: 1px solid #2a2a3a; background: #16162a;
      color: #aaa;
    }
    .topic-chip:hover { background: #252548; color: #fff; border-color: #4a4a6a; }
    .topic-chip .count { color: #555; margin-left: 4px; }

    .doc-list { list-style: none; }
    .doc-list li {
      padding: 12px 14px; margin-bottom: 6px;
      background: #16162a; border-radius: 10px; border: 1px solid #1e1e2e;
      cursor: pointer; transition: all 0.15s;
    }
    .doc-list li:hover { background: #1e1e3a; border-color: #3a3a5a; }
    .doc-list li .doc-title { font-size: 13px; color: #ddd; line-height: 1.4; }
    .doc-list li .doc-meta { font-size: 11px; color: #555; margin-top: 4px; }

    /* Header */
    #header { position: fixed; top: 20px; left: 24px; z-index: 5; }
    #header h1 {
      font-size: 24px; font-weight: 700; color: #fff;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #a78bfa, #6366f1);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    #header p { font-size: 11px; color: #444; margin-top: 2px; }

    /* Search */
    #search { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 5; }
    #search input {
      width: 360px; padding: 9px 16px; border-radius: 20px;
      border: 1px solid #1e1e2e; background: #111119; color: #ddd;
      font-size: 13px; outline: none;
    }
    #search input:focus { border-color: #6366f1; box-shadow: 0 0 0 2px rgba(99,102,241,0.15); }
    #search .results {
      position: absolute; top: 42px; left: 0; width: 360px;
      background: #111119; border: 1px solid #1e1e2e; border-radius: 12px;
      max-height: 260px; overflow-y: auto; display: none;
    }
    #search .results.visible { display: block; }
    #search .results .result-item {
      padding: 10px 16px; cursor: pointer; font-size: 13px;
      border-bottom: 1px solid #1a1a2a;
    }
    #search .results .result-item:hover { background: #1e1e3a; }
    #search .results .result-item:last-child { border: none; }
    #search .results .result-section {
      padding: 6px 16px 2px; font-size: 10px; color: #555;
      text-transform: uppercase; letter-spacing: 1px;
      border-bottom: 1px solid #1a1a2a;
    }
    #search .results .result-snippet {
      font-size: 11px; color: #555; margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* View toggle buttons */
    .view-toggles {
      position: fixed; top: 20px; right: 24px; z-index: 6;
      display: flex; gap: 8px;
    }
    .view-btn {
      background: #111119; border: 1px solid #1e1e2e; color: #888;
      padding: 8px 16px; border-radius: 20px; font-size: 12px;
      cursor: pointer; transition: all 0.15s; font-family: inherit;
    }
    .view-btn:hover { color: #fff; border-color: #6366f1; }
    .view-btn.active { color: #6366f1; border-color: #6366f1; background: #12122a; }

    /* Overview panel */
    #overview {
      position: fixed; top: 60px; right: 24px; z-index: 5;
      width: 320px; max-height: calc(100vh - 100px);
      background: #111119; border: 1px solid #1e1e2e; border-radius: 16px;
      overflow-y: auto; padding: 20px;
      display: none;
    }
    #overview.visible { display: block; }
    #overview h3 {
      font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px;
      color: #555; margin-bottom: 16px;
    }

    .overview-cat {
      margin-bottom: 18px; cursor: pointer;
      padding: 12px 14px; border-radius: 12px;
      border: 1px solid transparent;
      transition: all 0.15s;
    }
    .overview-cat:hover { background: #16162a; border-color: #1e1e2e; }
    .overview-cat .cat-header {
      display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
    }
    .overview-cat .cat-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .overview-cat .cat-name { font-size: 14px; font-weight: 600; color: #ddd; }
    .overview-cat .cat-count { font-size: 12px; color: #555; margin-left: auto; }
    .overview-cat .cat-topics { font-size: 12px; color: #666; line-height: 1.6; }
    .overview-cat .cat-topics span { color: #999; }

    /* Legend */
    #legend {
      position: fixed; bottom: 20px; left: 24px; z-index: 5;
      display: flex; flex-wrap: wrap; gap: 8px; max-width: 500px;
    }
    .legend-item {
      display: flex; align-items: center; gap: 5px;
      font-size: 11px; color: #555; cursor: pointer;
      padding: 3px 8px; border-radius: 10px;
      transition: all 0.15s;
    }
    .legend-item:hover { color: #aaa; background: rgba(255,255,255,0.03); }
    .legend-dot { width: 8px; height: 8px; border-radius: 50%; }

    /* Stats */
    #stats {
      position: fixed; bottom: 20px; right: 24px; z-index: 5;
      font-size: 11px; color: #333;
    }

    .tooltip {
      position: fixed; padding: 8px 14px; background: #16162a;
      border: 1px solid #2a2a3a; border-radius: 10px;
      font-size: 12px; pointer-events: none; z-index: 20;
      display: none; box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    .tooltip .tt-count { color: #6366f1; font-weight: 600; }

    /* Report view */
    #reportView {
      position: fixed; inset: 0; z-index: 4;
      background: #0a0a0f; overflow-y: auto;
      padding: 80px 40px 40px;
      display: none;
    }
    #reportView.visible { display: block; }
    #reportView .report-container { max-width: 800px; margin: 0 auto; }
    #reportView .report-header {
      margin-bottom: 32px;
    }
    #reportView .report-header h2 {
      font-size: 22px; font-weight: 700; color: #fff; margin-bottom: 8px;
    }
    #reportView .report-header .report-sub { font-size: 13px; color: #555; }
    #reportView .report-period {
      display: flex; gap: 12px; align-items: center; margin-bottom: 28px;
    }
    #reportView .report-period select,
    #reportView .report-period input {
      padding: 8px 14px; border-radius: 12px;
      border: 1px solid #1e1e2e; background: #111119; color: #ddd;
      font-size: 13px; outline: none; font-family: inherit;
    }
    #reportView .report-period select:focus,
    #reportView .report-period input:focus { border-color: #6366f1; }

    .report-category {
      margin-bottom: 28px;
    }
    .report-cat-header {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 14px; padding-bottom: 8px;
      border-bottom: 1px solid #1a1a2a;
    }
    .report-cat-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .report-cat-name { font-size: 16px; font-weight: 600; color: #ddd; }
    .report-cat-count { font-size: 12px; color: #555; margin-left: auto; }

    .report-cluster { margin-bottom: 16px; margin-left: 8px; }
    .report-cluster-name {
      font-size: 13px; font-weight: 600; color: #aaa; margin-bottom: 8px;
    }
    .report-doc {
      display: flex; align-items: baseline; gap: 10px;
      padding: 8px 12px; margin-bottom: 4px;
      border-radius: 8px; cursor: pointer; transition: background 0.15s;
    }
    .report-doc:hover { background: #16162a; }
    .report-doc .doc-title { font-size: 13px; color: #ccc; flex: 1; }
    .report-doc .doc-date { font-size: 11px; color: #555; white-space: nowrap; }
    .report-doc .doc-source {
      font-size: 10px; padding: 2px 8px; border-radius: 8px;
      background: #16162a; color: #666; white-space: nowrap;
    }

    .report-empty { font-size: 14px; color: #444; text-align: center; padding: 40px; }

    /* Password gate */
    #gate {
      position: fixed; inset: 0; z-index: 100;
      background: #0a0a0f; display: flex;
      align-items: center; justify-content: center;
      flex-direction: column; gap: 16px;
    }
    #gate h1 {
      font-size: 32px; font-weight: 700;
      background: linear-gradient(135deg, #a78bfa, #6366f1);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    #gate p { font-size: 13px; color: #444; }
    #gate input {
      width: 260px; padding: 10px 16px; border-radius: 12px;
      border: 1px solid #1e1e2e; background: #111119; color: #ddd;
      font-size: 14px; outline: none; text-align: center;
    }
    #gate input:focus { border-color: #6366f1; box-shadow: 0 0 0 2px rgba(99,102,241,0.15); }
    #gate .error { color: #f87171; font-size: 12px; min-height: 18px; }
    #gate.hidden { display: none; }
  </style>
</head>
<body>
  <div id="gate">
    <h1>LifeGraph</h1>
    <p>Enter password to view</p>
    <input type="password" id="gateInput" placeholder="Password" autofocus>
    <div class="error" id="gateError"></div>
  </div>

  <svg id="canvas"></svg>

  <div id="header">
    <h1>LifeGraph</h1>
    <p id="headerSub"></p>
  </div>

  <div id="search">
    <input type="text" placeholder="Search topics and documents..." id="searchInput">
    <div class="results" id="searchResults"></div>
  </div>

  <div class="view-toggles">
    <button class="view-btn active" id="graphBtn" onclick="switchView('graph')">Graph</button>
    <button class="view-btn" id="timelineBtn" onclick="switchView('timeline')">Timeline</button>
    <button class="view-btn" id="reportBtn" onclick="switchView('report')">Report</button>
    <button class="view-btn" id="overview-toggle" onclick="toggleOverview()">Overview</button>
  </div>
  <div id="overview">
    <h3>Work areas</h3>
    <div id="overviewContent"></div>
  </div>

  <div id="reportView">
    <div class="report-container">
      <div class="report-header">
        <h2>What did I work on?</h2>
        <div class="report-sub" id="reportSub"></div>
      </div>
      <div class="report-period">
        <select id="reportRange" onchange="updateReport()">
          <option value="7">Last 7 days</option>
          <option value="14">Last 14 days</option>
          <option value="30" selected>Last 30 days</option>
          <option value="60">Last 60 days</option>
          <option value="90">Last 90 days</option>
          <option value="180">Last 6 months</option>
          <option value="365">Last year</option>
          <option value="custom">Custom range</option>
        </select>
        <input type="date" id="reportFrom" style="display:none" onchange="updateReport()">
        <input type="date" id="reportTo" style="display:none" onchange="updateReport()">
      </div>
      <div id="reportContent"></div>
    </div>
  </div>

  <div id="legend"></div>
  <div id="stats"></div>

  <div id="sidebar">
    <button class="close-btn" onclick="closeSidebar()">&times;</button>
    <h2 id="sidebarTitle"></h2>
    <div class="meta" id="sidebarMeta"></div>
    <div class="section-title">Connected topics</div>
    <div id="relatedChips"></div>
    <div class="section-title" style="margin-top:20px">Documents</div>
    <ul class="doc-list" id="docList"></ul>
  </div>

  <div class="tooltip" id="tooltip"></div>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script>
    // Password gate using SHA-256 hash comparison
    const HASH = '1b1dc3f3b5599270eaef6fd2c6b1dcac6b5dd6919fb8c3605186466e922d3057';

    async function sha256(str) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
    }

    document.getElementById('gateInput').addEventListener('keydown', async (e) => {
      if (e.key !== 'Enter') return;
      const hash = await sha256(e.target.value);
      if (hash === HASH) {
        document.getElementById('gate').classList.add('hidden');
        init();
      } else {
        document.getElementById('gateError').textContent = 'Wrong password';
        e.target.value = '';
      }
    });

    let graphData, simulation, svg, g, nodeEls, linkEls, labelEls, clusterLabels;
    let docMap = {};
    let currentView = 'graph';

    const width = window.innerWidth;
    const height = window.innerHeight;

    // Category colors
    const catColors = {
      posture:   '#a78bfa',
      automation:'#6366f1',
      strategy:  '#3b82f6',
      ux:        '#06b6d4',
      team:      '#14b8a6',
      teaching:  '#f59e0b',
      personal:  '#f472b6',
      code:      '#34d399',
      other:     '#6b7280',
    };

    const catLabels = {
      posture: 'Posture & Coverage',
      automation: 'Automation & AI',
      strategy: 'Strategy & Planning',
      ux: 'UX & Design',
      team: 'Team & Meetings',
      teaching: 'Teaching & Education',
      personal: 'Personal',
      code: 'Code & Engineering',
    };

    // Category cluster positions (radial layout)
    const catAngles = {
      posture: -Math.PI / 4,
      automation: -Math.PI / 2,
      strategy: -3 * Math.PI / 4,
      ux: Math.PI,
      team: 3 * Math.PI / 4,
      teaching: Math.PI / 2,
      personal: Math.PI / 4,
      code: 0,
      other: 0,
    };

    async function init() {
      const resp = await fetch('graph.json');
      graphData = await resp.json();
      graphData.documents.forEach(d => docMap[d.id] = d);

      document.getElementById('headerSub').textContent = `Knowledge graph of ${graphData.documents.length} documents`;
      document.getElementById('stats').textContent =
        `${graphData.nodes.length} topics / ${graphData.edges.length} connections / ${graphData.documents.length} documents`;

      svg = d3.select('#canvas').attr('width', width).attr('height', height);
      const zoom = d3.zoom().scaleExtent([0.3, 4])
        .on('zoom', (e) => g.attr('transform', e.transform));
      svg.call(zoom);
      g = svg.append('g');

      // Defs for glow
      const defs = svg.append('defs');
      const filter = defs.append('filter').attr('id', 'glow');
      filter.append('feGaussianBlur').attr('stdDeviation', '3').attr('result', 'blur');
      filter.append('feMerge').selectAll('feMergeNode')
        .data(['blur', 'SourceGraphic']).join('feMergeNode').attr('in', d => d);

      render();
      buildLegend();
      buildOverview();
      setupSearch();
    }

    function render() {
      g.selectAll('*').remove();
      const nodes = graphData.nodes;
      const edges = graphData.edges;

      const sizeScale = d3.scaleSqrt()
        .domain([d3.min(nodes, n => n.doc_count), d3.max(nodes, n => n.doc_count)])
        .range([8, 40]);

      const edgeScale = d3.scaleLinear()
        .domain([d3.min(edges, e => e.weight) || 1, d3.max(edges, e => e.weight) || 1])
        .range([0.5, 3]);

      // Cluster force: pull nodes toward their category's radial position
      const clusterRadius = Math.min(width, height) * 0.25;
      function clusterForce(alpha) {
        nodes.forEach(n => {
          const angle = catAngles[n.category] || 0;
          const tx = width / 2 + Math.cos(angle) * clusterRadius;
          const ty = height / 2 + Math.sin(angle) * clusterRadius;
          n.vx += (tx - n.x) * alpha * 0.08;
          n.vy += (ty - n.y) * alpha * 0.08;
        });
      }

      simulation = d3.forceSimulation(nodes)
        .force('link', d3.forceLink(edges).id(d => d.id).distance(60).strength(e => e.weight * 0.03))
        .force('charge', d3.forceManyBody().strength(-200))
        .force('center', d3.forceCenter(width / 2, height / 2).strength(0.05))
        .force('collision', d3.forceCollide().radius(d => sizeScale(d.doc_count) + 10))
        .force('cluster', clusterForce);

      // Edges
      linkEls = g.append('g')
        .selectAll('line')
        .data(edges)
        .join('line')
        .attr('stroke', d => {
          const sNode = nodes.find(n => n.id === (typeof d.source === 'object' ? d.source.id : d.source));
          return sNode ? catColors[sNode.category] || '#333' : '#333';
        })
        .attr('stroke-width', d => edgeScale(d.weight))
        .attr('stroke-opacity', 0.08);

      // Category group labels (floating behind nodes)
      const catCenters = {};
      const catCounts = {};
      nodes.forEach(n => {
        const cat = n.category || 'other';
        if (!catCenters[cat]) { catCenters[cat] = { x: 0, y: 0, count: 0, docs: 0 }; }
        const angle = catAngles[cat] || 0;
        catCenters[cat].x = width / 2 + Math.cos(angle) * clusterRadius;
        catCenters[cat].y = height / 2 + Math.sin(angle) * clusterRadius;
        catCenters[cat].count++;
        catCenters[cat].docs += n.doc_count;
      });

      clusterLabels = g.append('g').attr('class', 'cluster-labels')
        .selectAll('g')
        .data(Object.entries(catCenters))
        .join('g')
        .attr('transform', ([cat, c]) => `translate(${c.x},${c.y - clusterRadius * 0.35})`);

      clusterLabels.append('text')
        .text(([cat]) => catLabels[cat] || cat)
        .attr('text-anchor', 'middle')
        .attr('font-size', 15)
        .attr('font-weight', 700)
        .attr('fill', ([cat]) => catColors[cat] || '#555')
        .attr('fill-opacity', 0.25)
        .style('pointer-events', 'none')
        .style('text-transform', 'uppercase')
        .style('letter-spacing', '2px');

      // Node groups
      const nodeGroup = g.append('g').selectAll('g').data(nodes).join('g')
        .style('cursor', 'pointer')
        .on('mouseover', onNodeHover)
        .on('mouseout', onNodeOut)
        .on('click', onNodeClick)
        .call(d3.drag().on('start', dragStart).on('drag', dragging).on('end', dragEnd));

      // Outer glow circle
      nodeGroup.append('circle')
        .attr('r', d => sizeScale(d.doc_count) + 4)
        .attr('fill', d => catColors[d.category] || '#555')
        .attr('opacity', 0.08)
        .attr('filter', 'url(#glow)');

      // Main circle
      nodeEls = nodeGroup.append('circle')
        .attr('r', d => sizeScale(d.doc_count))
        .attr('fill', d => catColors[d.category] || '#555')
        .attr('fill-opacity', 0.7)
        .attr('stroke', d => catColors[d.category] || '#555')
        .attr('stroke-width', 1.5)
        .attr('stroke-opacity', 0.4);

      // Labels -- always visible for top topics (doc_count >= 5), dimmer for small ones
      labelEls = nodeGroup.append('text')
        .text(d => d.name)
        .attr('font-size', d => Math.max(9, Math.min(14, 7 + d.doc_count * 0.4)))
        .attr('fill', d => d.doc_count >= 5 ? '#ddd' : '#666')
        .attr('font-weight', d => d.doc_count >= 10 ? 600 : 400)
        .attr('text-anchor', 'middle')
        .attr('dy', d => -sizeScale(d.doc_count) - 8)
        .style('pointer-events', 'none')
        .style('text-shadow', '0 0 8px #0a0a0f, 0 0 16px #0a0a0f');

      // Doc count badge
      nodeGroup.append('text')
        .text(d => d.doc_count)
        .attr('font-size', d => Math.max(8, sizeScale(d.doc_count) * 0.55))
        .attr('fill', '#fff')
        .attr('text-anchor', 'middle')
        .attr('dominant-baseline', 'central')
        .attr('font-weight', 600)
        .style('pointer-events', 'none');

      simulation.on('tick', () => {
        linkEls
          .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
          .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
        nodeGroup.attr('transform', d => `translate(${d.x},${d.y})`);
      });
    }

    function onNodeHover(event, d) {
      const tooltip = document.getElementById('tooltip');
      tooltip.style.display = 'block';
      tooltip.style.left = (event.clientX + 14) + 'px';
      tooltip.style.top = (event.clientY - 10) + 'px';
      tooltip.innerHTML = `${d.name} <span class="tt-count">${d.doc_count} docs</span>`;

      const connected = new Set();
      graphData.edges.forEach(e => {
        const s = typeof e.source === 'object' ? e.source.id : e.source;
        const t = typeof e.target === 'object' ? e.target.id : e.target;
        if (s === d.id) connected.add(t);
        if (t === d.id) connected.add(s);
      });

      g.selectAll('g > g').each(function(n) {
        d3.select(this).attr('opacity', n.id === d.id || connected.has(n.id) ? 1 : 0.12);
      });
      linkEls.attr('stroke-opacity', e => {
        const s = typeof e.source === 'object' ? e.source.id : e.source;
        const t = typeof e.target === 'object' ? e.target.id : e.target;
        return s === d.id || t === d.id ? 0.35 : 0.02;
      });
    }

    function onNodeOut() {
      document.getElementById('tooltip').style.display = 'none';
      g.selectAll('g > g').attr('opacity', 1);
      linkEls.attr('stroke-opacity', 0.08);
    }

    function onNodeClick(event, d) { openSidebar(d); }

    function openSidebar(topic) {
      document.getElementById('sidebarTitle').textContent = topic.name;
      document.getElementById('sidebarMeta').innerHTML =
        `<span style="color:${catColors[topic.category]}">${catLabels[topic.category] || topic.category}</span> &middot; ${topic.doc_count} documents`;

      // Docs
      const docs = (topic.doc_ids || []).map(id => docMap[id]).filter(Boolean)
        .sort((a, b) => (b.created_at || '').localeCompare(a.created_at || ''));
      document.getElementById('docList').innerHTML = docs.map(d => `
        <li onclick="window.open('${d.source_url || '#'}', '_blank')">
          <div class="doc-title">${d.title}</div>
          <div class="doc-meta">${d.source}${d.created_at ? ' &middot; ' + d.created_at.split('T')[0] : ''}</div>
        </li>
      `).join('');

      // Related topics
      const related = new Map();
      graphData.edges.forEach(e => {
        const s = typeof e.source === 'object' ? e.source.id : e.source;
        const t = typeof e.target === 'object' ? e.target.id : e.target;
        if (s === topic.id) related.set(t, e.weight);
        if (t === topic.id) related.set(s, e.weight);
      });

      const nodeMap = {};
      graphData.nodes.forEach(n => nodeMap[n.id] = n);

      const sorted = [...related.entries()].sort((a, b) => b[1] - a[1]);
      document.getElementById('relatedChips').innerHTML = sorted.map(([id, w]) => {
        const n = nodeMap[id];
        if (!n) return '';
        return `<span class="topic-chip" style="border-color:${catColors[n.category]}44"
          onclick="openSidebar(graphData.nodes.find(x=>x.id===${id}))">${n.name}<span class="count">${w}</span></span>`;
      }).join('');

      document.getElementById('sidebar').classList.add('open');
    }

    function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); }

    function buildLegend() {
      const cats = new Set(graphData.nodes.map(n => n.category));
      document.getElementById('legend').innerHTML = [...cats].map(c =>
        `<div class="legend-item" onclick="highlightCategory('${c}')">
          <div class="legend-dot" style="background:${catColors[c]}"></div>${catLabels[c] || c}
        </div>`
      ).join('');
    }

    function buildOverview() {
      // Group nodes by category, compute stats
      const cats = {};
      graphData.nodes.forEach(n => {
        const cat = n.category || 'other';
        if (!cats[cat]) cats[cat] = { topics: [], totalDocs: 0 };
        cats[cat].topics.push(n);
        cats[cat].totalDocs += n.doc_count;
      });

      // Sort categories by total docs
      const sorted = Object.entries(cats).sort((a, b) => b[1].totalDocs - a[1].totalDocs);

      document.getElementById('overviewContent').innerHTML = sorted.map(([cat, data]) => {
        const topTopics = data.topics
          .sort((a, b) => b.doc_count - a.doc_count)
          .slice(0, 4)
          .map(t => `<span>${t.name}</span> (${t.doc_count})`)
          .join(', ');

        return `
          <div class="overview-cat" onclick="highlightCategory('${cat}')">
            <div class="cat-header">
              <div class="cat-dot" style="background:${catColors[cat]}"></div>
              <div class="cat-name">${catLabels[cat] || cat}</div>
              <div class="cat-count">${data.totalDocs} docs</div>
            </div>
            <div class="cat-topics">${topTopics}</div>
          </div>`;
      }).join('');
    }

    function toggleOverview() {
      const panel = document.getElementById('overview');
      const btn = document.getElementById('overview-toggle');
      const isVisible = panel.classList.toggle('visible');
      btn.classList.toggle('active', isVisible);
    }

    function highlightCategory(cat) {
      // Close overview for cleaner view
      document.getElementById('overview').classList.remove('visible');
      document.getElementById('overview-toggle').classList.remove('active');

      g.selectAll('g > g').each(function(n) {
        d3.select(this).attr('opacity', n.category === cat ? 1 : 0.12);
      });
      linkEls.attr('stroke-opacity', e => {
        const s = typeof e.source === 'object' ? e.source : { id: e.source };
        const t = typeof e.target === 'object' ? e.target : { id: e.target };
        const sNode = graphData.nodes.find(n => n.id === s.id);
        const tNode = graphData.nodes.find(n => n.id === t.id);
        return (sNode?.category === cat && tNode?.category === cat) ? 0.25 : 0.02;
      });

      // Also highlight the cluster label
      clusterLabels.select('text')
        .attr('fill-opacity', ([c]) => c === cat ? 0.6 : 0.08);

      // Reset after 4s
      setTimeout(() => {
        g.selectAll('g > g').attr('opacity', 1);
        linkEls.attr('stroke-opacity', 0.08);
        clusterLabels.select('text').attr('fill-opacity', 0.25);
      }, 4000);
    }

    function setupSearch() {
      const input = document.getElementById('searchInput');
      const results = document.getElementById('searchResults');
      input.addEventListener('input', () => {
        const q = input.value.toLowerCase();
        if (q.length < 2) { results.classList.remove('visible'); return; }

        // Search topics
        const topicMatches = graphData.nodes.filter(n => n.name.toLowerCase().includes(q)).slice(0, 5);

        // Search documents by title + snippet
        const docMatches = graphData.documents.filter(d =>
          d.title.toLowerCase().includes(q) ||
          (d.snippet && d.snippet.toLowerCase().includes(q))
        ).slice(0, 6);

        if (!topicMatches.length && !docMatches.length) {
          results.classList.remove('visible'); return;
        }

        let html = '';
        if (topicMatches.length) {
          html += '<div class="result-section">Topics</div>';
          html += topicMatches.map(n =>
            `<div class="result-item" onclick="focusNode(${n.id})">${n.name} <span style="color:#6366f1">(${n.doc_count})</span></div>`
          ).join('');
        }
        if (docMatches.length) {
          html += '<div class="result-section">Documents</div>';
          html += docMatches.map(d => {
            const date = d.created_at ? d.created_at.split('T')[0] : '';
            const snippet = d.snippet || '';
            return `<div class="result-item" onclick="window.open('${d.source_url || '#'}', '_blank')">
              ${d.title} <span style="color:#555">${date}</span>
              ${snippet ? `<div class="result-snippet">${snippet.substring(0, 80)}...</div>` : ''}
            </div>`;
          }).join('');
        }

        results.innerHTML = html;
        results.classList.add('visible');
      });
      input.addEventListener('blur', () => setTimeout(() => results.classList.remove('visible'), 200));
    }

    function focusNode(id) {
      const node = graphData.nodes.find(n => n.id === id);
      if (!node || !node.x) return;
      document.getElementById('searchInput').value = '';
      document.getElementById('searchResults').classList.remove('visible');
      const transform = d3.zoomIdentity.translate(width/2, height/2).scale(2).translate(-node.x, -node.y);
      svg.transition().duration(750).call(
        d3.zoom().scaleExtent([0.3, 4]).on('zoom', e => g.attr('transform', e.transform)).transform, transform
      );
      openSidebar(node);
    }

    function dragStart(e, d) { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; }
    function dragging(e, d) { d.fx = e.x; d.fy = e.y; }
    function dragEnd(e, d) { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }

    // ── Timeline View ──────────────────────────────────────────

    function switchView(view) {
      if (view === currentView) return;
      currentView = view;

      document.getElementById('graphBtn').classList.toggle('active', view === 'graph');
      document.getElementById('timelineBtn').classList.toggle('active', view === 'timeline');
      document.getElementById('reportBtn').classList.toggle('active', view === 'report');

      // Hide legend in non-graph modes
      document.getElementById('legend').style.display = view === 'graph' ? 'flex' : 'none';
      document.getElementById('stats').style.display = view === 'report' ? 'none' : 'block';

      // Show/hide canvas vs report
      document.getElementById('canvas').style.display = view === 'report' ? 'none' : 'block';
      document.getElementById('reportView').classList.toggle('visible', view === 'report');

      if (view === 'report') {
        if (simulation) simulation.stop();
        updateReport();
      } else {
        // Reset zoom
        svg.call(d3.zoom().scaleExtent([0.3, 4]).on('zoom', e => g.attr('transform', e.transform))
          .transform, d3.zoomIdentity);

        if (view === 'graph') {
          if (simulation) simulation.stop();
          render();
        } else {
          if (simulation) simulation.stop();
          renderTimeline();
        }
      }

      closeSidebar();
    }

    function renderTimeline() {
      g.selectAll('*').remove();

      const nodes = graphData.nodes;
      const margin = { top: 40, right: 40, bottom: 50, left: 240 };
      const w = width - margin.left - margin.right;
      const h = height - margin.top - margin.bottom;

      // Sort nodes: by category order, then by doc_count within category
      const catOrder = ['posture', 'automation', 'strategy', 'ux', 'team', 'teaching', 'code', 'personal', 'other'];
      const sorted = [...nodes].sort((a, b) => {
        const ca = catOrder.indexOf(a.category), cb = catOrder.indexOf(b.category);
        if (ca !== cb) return ca - cb;
        return b.doc_count - a.doc_count;
      });

      // Time scale
      const allDates = graphData.documents
        .map(d => d.created_at ? new Date(d.created_at) : null)
        .filter(Boolean);
      const xScale = d3.scaleTime()
        .domain([d3.min(allDates), d3.max(allDates)])
        .range([margin.left, width - margin.right]);

      // Y scale: one band per topic
      const rowHeight = Math.min(28, h / sorted.length);
      const totalHeight = rowHeight * sorted.length;
      const yStart = margin.top + Math.max(0, (h - totalHeight) / 2);

      const tg = g.append('g');

      // Draw category headers + swim lanes
      let lastCat = null;
      sorted.forEach((node, i) => {
        const y = yStart + i * rowHeight;

        // Category header
        if (node.category !== lastCat) {
          lastCat = node.category;
          // Category separator line
          if (i > 0) {
            tg.append('line')
              .attr('x1', margin.left - 10).attr('x2', width - margin.right)
              .attr('y1', y - 2).attr('y2', y - 2)
              .attr('stroke', catColors[node.category] || '#333')
              .attr('stroke-opacity', 0.15);
          }
        }

        // Alternating row shading
        tg.append('rect')
          .attr('x', margin.left - 10)
          .attr('y', y)
          .attr('width', w + 20)
          .attr('height', rowHeight)
          .attr('fill', i % 2 === 0 ? 'rgba(255,255,255,0.015)' : 'transparent');

        // Topic label on the left
        tg.append('text')
          .text(node.name)
          .attr('x', margin.left - 16)
          .attr('y', y + rowHeight / 2)
          .attr('text-anchor', 'end')
          .attr('dominant-baseline', 'central')
          .attr('font-size', Math.min(11, rowHeight * 0.45))
          .attr('fill', catColors[node.category] || '#888')
          .attr('fill-opacity', node.doc_count >= 5 ? 0.9 : 0.5)
          .attr('font-weight', node.doc_count >= 10 ? 600 : 400)
          .style('cursor', 'pointer')
          .on('click', () => openSidebar(node));
      });

      // X axis
      const xAxis = d3.axisBottom(xScale)
        .ticks(d3.timeMonth.every(1))
        .tickFormat(d3.timeFormat('%b %Y'));

      tg.append('g')
        .attr('transform', `translate(0, ${yStart + totalHeight + 10})`)
        .call(xAxis)
        .selectAll('text')
          .attr('fill', '#555')
          .attr('font-size', 10)
          .attr('transform', 'rotate(-30)')
          .attr('text-anchor', 'end');
      tg.selectAll('.domain, .tick line').attr('stroke', '#1e1e2e');

      // Month grid lines
      const ticks = xScale.ticks(d3.timeMonth.every(1));
      ticks.forEach(t => {
        tg.append('line')
          .attr('x1', xScale(t)).attr('x2', xScale(t))
          .attr('y1', yStart - 5).attr('y2', yStart + totalHeight)
          .attr('stroke', '#1e1e2e').attr('stroke-opacity', 0.5);
      });

      // Build a map: nodeIndex -> node for fast lookup
      const nodeIndexMap = {};
      sorted.forEach((node, i) => nodeIndexMap[node.id] = i);

      // Draw dots: one per (doc, topic) pair
      const dots = [];
      sorted.forEach((node, i) => {
        (node.doc_ids || []).forEach(docId => {
          const doc = docMap[docId];
          if (!doc || !doc.created_at) return;
          dots.push({ node, nodeIndex: i, doc, date: new Date(doc.created_at) });
        });
      });

      tg.selectAll('circle.dot')
        .data(dots)
        .join('circle')
        .attr('class', 'dot')
        .attr('cx', d => xScale(d.date))
        .attr('cy', d => yStart + d.nodeIndex * rowHeight + rowHeight / 2)
        .attr('r', 4)
        .attr('fill', d => catColors[d.node.category] || '#555')
        .attr('fill-opacity', 0.7)
        .attr('stroke', d => catColors[d.node.category] || '#555')
        .attr('stroke-width', 1)
        .attr('stroke-opacity', 0.3)
        .style('cursor', 'pointer')
        .on('mouseover', (event, d) => {
          const tooltip = document.getElementById('tooltip');
          tooltip.style.display = 'block';
          tooltip.style.left = (event.clientX + 14) + 'px';
          tooltip.style.top = (event.clientY - 10) + 'px';
          tooltip.innerHTML = `<strong>${d.doc.title}</strong><br>
            <span style="color:#555">${d.date.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' })}</span>
            <span class="tt-count">${d.node.name}</span>`;
          d3.select(event.target).attr('r', 6).attr('fill-opacity', 1);
        })
        .on('mouseout', (event) => {
          document.getElementById('tooltip').style.display = 'none';
          d3.select(event.target).attr('r', 4).attr('fill-opacity', 0.7);
        })
        .on('click', (event, d) => openSidebar(d.node));
    }

    // ── Report View ──────────────────────────────────────────

    function updateReport() {
      const rangeSelect = document.getElementById('reportRange');
      const fromInput = document.getElementById('reportFrom');
      const toInput = document.getElementById('reportTo');

      const isCustom = rangeSelect.value === 'custom';
      fromInput.style.display = isCustom ? 'inline-block' : 'none';
      toInput.style.display = isCustom ? 'inline-block' : 'none';

      let startDate, endDate = new Date();
      if (isCustom) {
        if (!fromInput.value || !toInput.value) return;
        startDate = new Date(fromInput.value);
        endDate = new Date(toInput.value);
      } else {
        const days = parseInt(rangeSelect.value);
        startDate = new Date();
        startDate.setDate(startDate.getDate() - days);
      }

      renderReport(startDate, endDate);
    }

    function renderReport(startDate, endDate) {
      // Filter docs in date range
      const docs = graphData.documents.filter(d => {
        if (!d.created_at) return false;
        const date = new Date(d.created_at);
        return date >= startDate && date <= endDate;
      }).sort((a, b) => (b.created_at || '').localeCompare(a.created_at || ''));

      const startStr = startDate.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
      const endStr = endDate.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
      document.getElementById('reportSub').textContent = `${startStr} - ${endStr} (${docs.length} documents)`;

      if (!docs.length) {
        document.getElementById('reportContent').innerHTML = '<div class="report-empty">No documents found in this period.</div>';
        return;
      }

      // Build doc ID set for this period
      const docIdSet = new Set(docs.map(d => d.id));

      // Map docs to clusters via nodes
      // node -> docs in this period that belong to it
      const nodeDocMap = {};
      graphData.nodes.forEach(n => {
        const periodDocs = (n.doc_ids || []).filter(id => docIdSet.has(id));
        if (periodDocs.length > 0) {
          nodeDocMap[n.id] = periodDocs;
        }
      });

      // Group nodes by category
      const catOrder = ['posture', 'automation', 'strategy', 'ux', 'team', 'teaching', 'code', 'personal', 'other'];
      const catGroups = {};
      graphData.nodes.forEach(n => {
        if (!nodeDocMap[n.id]) return;
        const cat = n.category || 'other';
        if (!catGroups[cat]) catGroups[cat] = [];
        catGroups[cat].push(n);
      });

      // Track which docs got categorized
      const categorizedDocs = new Set();

      let html = '';
      catOrder.forEach(cat => {
        const nodes = catGroups[cat];
        if (!nodes || !nodes.length) return;

        // Sort clusters by doc count in period
        nodes.sort((a, b) => (nodeDocMap[b.id]?.length || 0) - (nodeDocMap[a.id]?.length || 0));

        // Deduplicate docs within this category: each doc shows only under its first (largest) cluster
        const seenInCat = new Set();

        const clusterHtmlParts = [];
        nodes.forEach(n => {
          const periodDocIds = (nodeDocMap[n.id] || []).filter(id => !seenInCat.has(id));
          if (!periodDocIds.length) return;

          periodDocIds.forEach(id => seenInCat.add(id));

          let clusterHtml = `<div class="report-cluster">
            <div class="report-cluster-name">${n.name}</div>`;

          periodDocIds.forEach(docId => {
            const doc = docMap[docId];
            if (!doc) return;
            categorizedDocs.add(docId);
            const date = doc.created_at ? new Date(doc.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '';
            const url = doc.source_url || '#';
            clusterHtml += `<div class="report-doc" onclick="window.open('${url}', '_blank')">
              <div class="doc-title">${doc.title}</div>
              <div class="doc-source">${doc.source}</div>
              <div class="doc-date">${date}</div>
            </div>`;
          });

          clusterHtml += `</div>`;
          clusterHtmlParts.push(clusterHtml);
        });

        if (!seenInCat.size) return;

        html += `<div class="report-category">
          <div class="report-cat-header">
            <div class="report-cat-dot" style="background:${catColors[cat]}"></div>
            <div class="report-cat-name">${catLabels[cat] || cat}</div>
            <div class="report-cat-count">${seenInCat.size} docs</div>
          </div>`;
        html += clusterHtmlParts.join('');
        html += `</div>`;
      });

      // Uncategorized docs
      const uncategorized = docs.filter(d => !categorizedDocs.has(d.id));
      if (uncategorized.length) {
        html += `<div class="report-category">
          <div class="report-cat-header">
            <div class="report-cat-dot" style="background:#6b7280"></div>
            <div class="report-cat-name">Uncategorized</div>
            <div class="report-cat-count">${uncategorized.length} docs</div>
          </div>
          <div class="report-cluster">`;
        uncategorized.forEach(doc => {
          const date = doc.created_at ? new Date(doc.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '';
          const url = doc.source_url || '#';
          html += `<div class="report-doc" onclick="window.open('${url}', '_blank')">
            <div class="doc-title">${doc.title}</div>
            <div class="doc-source">${doc.source}</div>
            <div class="doc-date">${date}</div>
          </div>`;
        });
        html += `</div></div>`;
      }

      document.getElementById('reportContent').innerHTML = html;
    }

  </script>
</body>
</html>
