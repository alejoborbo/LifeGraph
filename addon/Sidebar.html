<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0f; color: #e0e0e0; padding: 16px;
      font-size: 13px; line-height: 1.5;
    }

    h1 {
      font-size: 20px; font-weight: 700;
      background: linear-gradient(135deg, #a78bfa, #6366f1);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }
    .subtitle { font-size: 11px; color: #444; margin-bottom: 20px; }

    /* Buttons */
    .btn {
      display: inline-block; padding: 8px 16px; border-radius: 8px;
      border: none; font-size: 12px; cursor: pointer;
      font-family: inherit; transition: all 0.15s;
    }
    .btn-ghost {
      background: transparent; color: #888; border: 1px solid #1e1e2e;
    }
    .btn-ghost:hover { color: #ddd; border-color: #3a3a5a; }

    /* Sections */
    .section-title {
      font-size: 10px; color: #555; text-transform: uppercase;
      letter-spacing: 1.2px; margin: 20px 0 10px; font-weight: 600;
    }

    /* Topics */
    .topic-chip {
      display: inline-block; padding: 4px 10px; margin: 3px 4px 3px 0;
      border-radius: 12px; font-size: 11px;
      border: 1px solid #2a2a3a; background: #16162a; color: #bbb;
    }
    .topic-chip .count {
      color: #555; margin-left: 3px; font-size: 10px;
    }

    /* Doc list */
    .doc-item {
      padding: 10px 12px; margin-bottom: 6px;
      background: #111119; border-radius: 10px; border: 1px solid #1e1e2e;
      cursor: pointer; transition: all 0.15s; text-decoration: none;
      display: block; color: inherit;
    }
    .doc-item:hover { background: #1e1e3a; border-color: #3a3a5a; }
    .doc-title { font-size: 12px; color: #ddd; line-height: 1.4; }
    .doc-meta { font-size: 10px; color: #555; margin-top: 3px; }
    .doc-topics { font-size: 10px; color: #6366f1; margin-top: 3px; }

    /* States */
    .loading { text-align: center; padding: 40px 0; color: #555; }
    .spinner {
      width: 24px; height: 24px; border: 2px solid #1e1e2e;
      border-top-color: #6366f1; border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error { color: #f87171; font-size: 12px; margin: 10px 0; }
    .empty { color: #555; font-size: 12px; font-style: italic; margin: 10px 0; }
    .not-found {
      text-align: center; padding: 30px 0; color: #555;
    }
    .not-found p { margin-bottom: 8px; }

    /* Footer */
    .footer {
      margin-top: 24px; padding-top: 16px;
      border-top: 1px solid #1e1e2e; text-align: center;
    }
    .footer a {
      color: #6366f1; text-decoration: none; font-size: 12px;
    }
    .footer a:hover { text-decoration: underline; }

    .actions { margin-bottom: 16px; }
  </style>
</head>
<body>
  <h1>LifeGraph</h1>
  <div class="subtitle" id="docTitle">Loading...</div>

  <!-- Loading state -->
  <div id="loadingView">
    <div class="loading">
      <div class="spinner"></div>
      <div>Looking up document in graph...</div>
    </div>
  </div>

  <!-- Not found -->
  <div id="notFoundView" style="display:none">
    <div class="not-found">
      <p>This document isn't in the knowledge graph yet.</p>
      <p style="font-size:11px">Run <code style="color:#6366f1">lifegraph sync</code> and <code style="color:#6366f1">lifegraph extract</code> to add it.</p>
    </div>
    <div class="footer">
      <a href="https://capmann.github.io/LifeGraph/" target="_blank">View full graph &rarr;</a>
    </div>
  </div>

  <!-- Results -->
  <div id="resultsView" style="display:none">
    <div class="actions">
      <button class="btn btn-ghost" onclick="analyze()">Refresh</button>
    </div>

    <div class="section-title">Topics</div>
    <div id="topicChips"></div>

    <div class="section-title">Related documents</div>
    <div id="relatedDocs"></div>

    <div class="footer">
      <a href="https://capmann.github.io/LifeGraph/" target="_blank">View full graph &rarr;</a>
    </div>
  </div>

  <!-- Error -->
  <div id="errorView" style="display:none">
    <div class="error" id="errorText"></div>
    <button class="btn btn-ghost" onclick="analyze()">Retry</button>
  </div>

  <script>
    var CAT_COLORS = {
      posture:   '#a78bfa',
      automation:'#6366f1',
      strategy:  '#3b82f6',
      ux:        '#06b6d4',
      team:      '#14b8a6',
      teaching:  '#f59e0b',
      personal:  '#f472b6',
      code:      '#34d399',
      other:     '#6b7280',
    };

    function showView(id) {
      ['loadingView', 'resultsView', 'notFoundView', 'errorView'].forEach(function(v) {
        document.getElementById(v).style.display = v === id ? 'block' : 'none';
      });
    }

    function showError(msg) {
      document.getElementById('errorText').textContent = msg;
      showView('errorView');
    }

    function analyze() {
      showView('loadingView');

      google.script.run
        .withSuccessHandler(function(doc) {
          document.getElementById('docTitle').textContent = doc.title;

          google.script.run
            .withSuccessHandler(function(result) {
              if (!result.topics.length) {
                showView('notFoundView');
                return;
              }
              renderTopics(result.topics);
              renderRelatedDocs(result.relatedDocs);
              showView('resultsView');
            })
            .withFailureHandler(function(e) { showError(e.message); })
            .lookupDocument(doc.title);
        })
        .withFailureHandler(function(e) { showError(e.message); })
        .getDocumentText();
    }

    function renderTopics(topics) {
      var html = '';
      for (var i = 0; i < topics.length; i++) {
        var t = topics[i];
        var color = CAT_COLORS[t.category] || CAT_COLORS.other;
        html += '<span class="topic-chip" style="border-color:' + color + '44; color:' + color + '">'
          + escapeHtml(t.name)
          + '<span class="count">' + t.docCount + ' docs</span>'
          + '</span>';
      }
      document.getElementById('topicChips').innerHTML = html;
    }

    function renderRelatedDocs(docs) {
      if (!docs || !docs.length) {
        document.getElementById('relatedDocs').innerHTML =
          '<div class="empty">No related documents found</div>';
        return;
      }

      var html = '';
      for (var i = 0; i < docs.length; i++) {
        var d = docs[i];
        var date = d.created_at ? d.created_at.split('T')[0] : '';
        var topicList = d.sharedTopics.slice(0, 3).join(', ');
        html += '<a class="doc-item" href="' + escapeHtml(d.url) + '" target="_blank">'
          + '<div class="doc-title">' + escapeHtml(d.title) + '</div>'
          + '<div class="doc-meta">' + escapeHtml(d.source) + (date ? ' &middot; ' + date : '') + '</div>'
          + '<div class="doc-topics">' + escapeHtml(topicList) + '</div>'
          + '</a>';
      }
      document.getElementById('relatedDocs').innerHTML = html;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // Auto-analyze on load
    analyze();
  </script>
</body>
</html>
